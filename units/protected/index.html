<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Y11/Y12 · VCE 中文</title>
<link rel="stylesheet" href="../../assets/style.css">
<meta name="theme-color" content="#1f6feb">
<style>
  .gate{max-width:460px;margin:60px auto;padding:0 20px;text-align:center}
  .gate .spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;margin:0 auto 16px;animation:sp 0.8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .gate h2{font-size:19px;margin:0 0 8px}
  .gate p{color:var(--muted);font-size:15px;line-height:1.6}
  .gate .btn{display:inline-block;margin-top:16px;padding:10px 20px;background:var(--blue);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer}
  .gate .btn.ghost{background:#f2f4f8;color:var(--blue-d)}
  /* 防拷贝：图片不可拖拽/长按存 */
  #wm-host img{-webkit-user-drag:none;user-drag:none}

  /* ---- 受保护课页的通用加样式 ----
     受保护内容来自数据库，没有自己的 <style>，所以要用的样式都写在这个外壳里。 */

  /* 词卡 🔊 圆钮已并入全站 style.css（v60） */
  /* 背面要放「完整中文例句 + 英文」，比一般词卡装得多，加高一点 */
  .flip{height:164px}
  .flip .back{font-size:15px;padding:8px 9px}
  .flip .back .bk-zh{font-size:14px;line-height:1.45}
  .flip .back .bk-en{font-size:11.5px;margin-top:5px;line-height:1.3}
  .flip .front .hz{font-size:23px}
  .flip .front .py{font-size:12px}
  /* 句式模板里的整句英文小字注解 */
  small.en{display:block;margin-top:5px;color:#5a6472;font-size:12.5px;line-height:1.5}
  /* .fact 是 flex：左边 .k 标签 flex:none 不收缩，右边内容 flex item 默认
     min-width:auto 也不肯收缩 → 长内容会把卡片撑破，手机上横向溢出。
     所以给 k 限宽、给内容区放开收缩。 */
  /* 不设 min-width：.k 已是 flex:none（按内容宽度，不会换行），设死宽只会让
     格式卡那种单个数字的标签白占 84px，手机上很亏。只限最大宽度防它霸屏。 */
  .facts .k{max-width:38%;overflow-wrap:anywhere}
  .fact>div:last-child{min-width:0}

  /* ---- 写作格式卡（第 2 节）----
     原稿是 17 列方格稿纸，手机上没法看；改成竖排「信纸」块，
     靠缩进和对齐把版式讲清楚：顶格 / 空两格 / 居中 / 右对齐。 */
  .fmt{background:#fffdf7;border:1px solid #e8dfc8;border-radius:8px;
    padding:12px 14px;margin:6px 0 8px;
    background-image:repeating-linear-gradient(#fffdf7 0 27px,#f0e8d4 27px 28px);
    font-family:'LXGW Kai','KaiTi','楷体',serif;font-size:15px;line-height:28px}
  .fmt .ln{white-space:pre-wrap;overflow-wrap:anywhere}  /* pre-wrap 保留全角空格排版；anywhere 让长网址能断行 */
  .fmt .i2{text-indent:2em}          /* 正文空两格 */
  .fmt .c{text-align:center}         /* 标题居中 */
  .fmt .r{text-align:right}          /* 署名 / 日期靠右 */
  .fmt .sm{font-size:13px;color:#6b6252}
  .fmt .blank{color:#b9ae95}         /* 省略号占位 */
  .fmt-tip{font-size:13.5px;color:#2a3648;background:#eef4ff;
    border-left:3px solid #1f6feb;border-radius:6px;padding:8px 10px;line-height:1.6}
  .fmt-en{color:#7a8496;font-weight:400;font-size:13px;margin-left:4px}
</style>
</head>
<body>
<div class="gate" id="gate">
  <div class="spin"></div>
  <p>正在验证登录… Verifying…</p>
</div>

<!-- 目录清单：受保护课页也要「上一节/下一节」，lesson.js 靠 CATALOG 找同一单元的兄弟节。
     catalog.js 只有标题和链接，不含受保护正文。 -->
<script src="../../assets/catalog.js"></script>
<script src="../../assets/auth.js"></script>
<script>
(function(){
  "use strict";
  const A = window.VCEAuth;
  const gate = document.getElementById("gate");
  const id = new URLSearchParams(location.search).get("id");
  const selfUrl = location.pathname.split("/").slice(-2).join("/") ; // units/protected/... 的相对
  const nextParam = encodeURIComponent("units/protected/index.html" + location.search);

  function show(html){ gate.innerHTML = html; }
  function toLogin(){ location.href = "../../login.html?next=" + nextParam; }

  async function boot(){
    if (!id) { show("<h2>缺少课程编号</h2><p>Missing lesson id.</p><a class='btn' href='../../index.html'>返回首页</a>"); return; }
    if (!A.isLoggedIn()) { toLogin(); return; }

    // 校验档案状态
    const p = await A.getProfile();
    if (!p) { toLogin(); return; }
    if (p.status !== "approved" ||
        (p.access_until && new Date(p.access_until) < new Date())) {
      toLogin(); return;   // 登录页会显示"等审批/已过期"
    }

    // 占单设备坑
    const r = await A.claimSession();
    // 2026-10-05：学生自己换设备（手机 → 电脑），不用老师操作。
    // 「在这台设备继续用」= 删掉本账号的占用记录（RLS 允许删自己的）再重新占坑，另一台下次打开就被挡在这页。
    if (r === "occupied") {
      show("<h2>⚠️ 这个账号正在另一台设备上使用</h2>" +
           "<p>一个账号同一时间只能在一台设备上用。<br>" +
           "想换到这台设备：点下面的蓝色按钮，另一台设备会自动下线。<br>" +
           "This account is in use on another device. Tap the blue button to use it here — the other device will be signed out.</p>" +
           "<button class='btn' id='here'>在这台设备继续用 Use it here</button><br>" +
           "<button class='btn ghost' id='lo'>换个账号 Use another account</button>" +
           "<p id='hereMsg' style='color:#c0392b'></p>");
      document.getElementById("here").onclick = async (e) => {
        e.target.disabled = true; e.target.textContent = "切换中… Switching…";
        try {
          await A.claimRelease();
          const r2 = await A.claimSession();
          if (r2 === "claimed" || r2 === "ok" || r2 === "took_over") { location.reload(); return; }
          throw new Error(r2);
        } catch (err) {
          e.target.disabled = false; e.target.textContent = "在这台设备继续用 Use it here";
          document.getElementById("hereMsg").textContent = "切换没成功，请再点一次；还不行就点「换个账号」重新登录。(" + (err.message || "") + ")";
        }
      };
      document.getElementById("lo").onclick = async () => { await A.logout(); toLogin(); };
      return;
    }
    if (r === "not_allowed") { toLogin(); return; }

    // 拉取受保护内容（RLS 按 tier 放行）
    let row;
    try { row = await A.getLesson(id); }
    catch(e){ show("<h2>加载失败</h2><p>"+ (e.message||"") +"</p><button class='btn' onclick='location.reload()'>重试 Retry</button>"); return; }
    if (!row) {
      show("<h2>无法访问此内容</h2><p>你的账号可能没有该年级的权限，或课程不存在。<br>No access to this content.</p><a class='btn' href='../../index.html'>返回首页</a>");
      return;
    }

    // 喂给现有引擎渲染
    const content = row.content || {};
    window.LESSON  = content.LESSON || content;   // 兼容：content 直接是 LESSON，或 {LESSON,WORDS}
    window.WORDS   = content.WORDS  || {};
    window.CATALOG = window.CATALOG || { site:"VCE 中文", grades:[] };

    const s = document.createElement("script");
    s.src = "../../assets/lesson.js";
    s.onload = async () => {
      addLogoutButton();
      const teacher = await A.isTeacher();        // 老师：只显品牌行，投屏不漏邮箱
      applyWatermark(A.currentEmail(), teacher);
      armAntiCopy();
    };
    s.onerror = () => show("<h2>引擎加载失败</h2><p>请重试。</p>");
    document.body.appendChild(s);   // lesson.js 立即执行、重写 body
  }

  // ---- 顶栏「🚪 退出」（2026-10-05）----
  // 用完学校/公用电脑要退出，不然下一个人能用你的账号；退出也会放掉单设备占用，换设备更顺。
  function addLogoutButton(){
    const bar = document.querySelector(".navbtns");
    if (!bar || document.getElementById("logoutBtn")) return;
    const a = document.createElement("a");
    a.id = "logoutBtn"; a.href = "javascript:void(0)"; a.textContent = "🚪 退出 Log out";
    a.style.marginLeft = "auto";
    a.onclick = async () => {
      if (!confirm("退出登录？\n用完学校或别人的电脑，一定要退出。\n\nLog out now? Always log out on a shared computer.")) return;
      try { await A.logout(); } catch (e) {}
      location.href = "../../index.html";
    };
    bar.appendChild(a);
  }

  // ---- 水印（双行：品牌大字 + 访客标识小字，平铺半透明）----
  // 品牌行人人都看得到；小字行是泄漏溯源用的证据，
  // 老师自己登录时不显（上课投屏不把私人邮箱扒在屏幕上）。
  const WM_BRAND = "周老师的VCE中文教案";
  function applyWatermark(email, isTeacher){
    const esc = t => String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;");
    // 学生：品牌大字 + 【授权使用，请勿传播：邮箱-日期】
    // （拆两行排：整串在 340px 的水印格里会溢出，长邮箱尤其）
    const d = new Date();
    const day = d.getFullYear() + "/" + (d.getMonth()+1) + "/" + d.getDate();
    const line2 = isTeacher ? "" : "【授权使用，请勿传播：";
    const line3 = isTeacher ? "" : (esc(email || "已登录") + "-" + day + "】");
    const svg = "<svg xmlns='http://www.w3.org/2000/svg' width='460' height='190'>" +
      "<g transform='rotate(-20 230 95)' fill='#123' font-family='sans-serif'>" +
      "<text x='24' y='86' font-size='17' font-weight='600'>【" + esc(WM_BRAND) + "】</text>" +
      (line2 ? "<text x='24' y='106' font-size='11'>" + line2 + "</text>" : "") +
      (line3 ? "<text x='24' y='122' font-size='11'>" + line3 + "</text>" : "") +
      "</g></svg>";
    const uri = "data:image/svg+xml," + encodeURIComponent(svg);
    let host = document.getElementById("wm-host");
    if (!host) { host = document.createElement("div"); host.id = "wm-host"; document.documentElement.appendChild(host); }
    // 只在屏幕上、下两条带铺（repeat-x），中间读文区留白。
    // 水印层是 fixed，滚到哪儿两条带都贴着屏幕上下沿，截图跑不掉。
    host.setAttribute("style",
      "position:fixed;inset:0;z-index:9998;pointer-events:none;opacity:0.10;" +
      "background-image:url(\"" + uri + "\"),url(\"" + uri + "\");" +
      "background-position:left top,left bottom;" +
      "background-repeat:repeat-x,repeat-x;");
  }

  // ---- 防拷贝（只加低代价的三项；浏览器里的内容真防不住，靠水印威慑）----
  // ① 屏蔽打印 / 另存 PDF　② 手机长按图片不弹「保存」　③ 全页禁右键
  // 文字仍可选中：学生要圈词查字典，老师自己也要复制。
  function armAntiCopy(){
    document.addEventListener("contextmenu", e => e.preventDefault());
    document.addEventListener("dragstart",  e => { if (e.target && e.target.tagName === "IMG") e.preventDefault(); });
    const st = document.createElement("style");
    st.textContent =
      "img{-webkit-touch-callout:none;-webkit-user-drag:none}" +
      "@media print{body>*{display:none!important}" +
      "body::after{content:'【" + WM_BRAND + "】受保护内容，不提供打印。';" +
      "display:block;padding:60px 20px;text-align:center;font-size:18px}}";
    document.head.appendChild(st);
  }

  boot().catch(e => show("<h2>出错了</h2><p>" + (e.message||"") + "</p><button class='btn' onclick='location.reload()'>重试</button>"));
})();
</script>
</body>
</html>
