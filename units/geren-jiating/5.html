<script>
window.LESSON = {
  id:"geren-jiating-5", n:5, unit:"geren-jiating",
  unitTitle:"Unit 1 个人情况 ·（四）介绍家庭",
  title:"句式 · 进阶 SLA",
  subtitle:"从「报成员」到「讲这个家」",
  sections:[

    { type:"culture", title:"SLA 到底比 SL 多了什么？", sub:"👆 带下划线的词可以点，看拼音和英文解释", facts:[
      { k:"VCAA 的话", html:"<u class=\"wd\" data-w=\"评分标准\">评分</u>报告要求 SLA 考生避免 <b>“Factual Information Only”</b>——只报「爸爸是工程师、妈妈是老师」不够，要讲出你<b>对这个家的看法</b>。"+
        "<small class=\"en\">The VCAA report tells SLA candidates to avoid <b>factual information only</b>. “Dad is an engineer, Mum is a teacher” is not enough — you need to say <b>what you think about your family</b>.</small>" },
      { k:"看差别", html:"<div class=\"up\"><div class=\"lv1\"><span class=\"tag\">SL 普通回答</span>我爸爸是工程师，妈妈是老师。周末我们一起去旅游。</div><div class=\"lv2\"><span class=\"tag\">SLA 升级</span><b>说白了</b>，在我们家，传统价值观和现代思维是<b>并存</b>的。我父母<b>更看重的是</b>平等的交流，<b>而不是</b>盲目的顺从。</div></div>" },
      { k:"三个动作", html:"① 从「谁做什么」转到「家里<u class=\"wd\" data-w=\"价值观\">看重什么</u>」 ② 用高级<u class=\"wd\" data-w=\"句型\">句型</u>讲出<b>对比和取舍</b> ③ 加<u class=\"wd\" data-w=\"语气词\">语气词</u>，让它听起来是在「说」而不是「背」"+
        "<small class=\"en\">Three moves: ① shift from “who does what” to “what the family values” ② use advanced patterns to express <b>contrast and choice</b> ③ add spoken fillers so it sounds <b>spoken</b>, not recited.</small>" }
    ] },

    { type:"culture", title:"一、SLA 必背句型", sub:"全部来自课文二、课文三 · 能熟练用三个，档次就上来了", facts:[
      { k:"对我来说", html:"<span class=\"pat\">对我来说，……</span>引出<b>你自己的看法</b>，是个人见解的开关。<span class=\"src\"><b>对我来说</b>，家里的氛围就是大家常说的“中西合璧”。</span>" },
      { k:"一方面…另一方面", html:"<span class=\"pat\">一方面……，另一方面又……</span>讲一个家的<b>两面</b>——正好用来说「中西合璧」。<span class=\"src\">我家里<b>一方面</b>讲究“百善孝为先”，<b>另一方面又</b>非常民主。</span>仿写：我家一方面＿＿＿＿，另一方面又＿＿＿＿。" },
      { k:"不但不…反而", html:"<span class=\"pat\">不但不……，反而……</span>说一件<b>出乎意料</b>的事：别人以为会这样，结果正好相反。<span class=\"src\">我爸妈平时<b>不但不</b>要求我盲目顺从，<b>反而</b>总是在大事小事上鼓励我独立思考。</span>" },
      { k:"要么…要么", html:"<span class=\"pat\">要么……，要么……</span>两个选项<b>二选一</b>，讲一家人的习惯。<span class=\"src\">周末我们全家<b>要么</b>去打球，<b>要么</b>就坐在一起天南地北地乱聊。</span>" },
      { k:"更看重…而不是", html:"<span class=\"pat\">更看重的是……，而不是……</span>直接说出<b>取舍</b>——这就是在讲价值观。<span class=\"src\">我父母<b>更看重的是</b>那种平等的交流，<b>而不是</b>那种盲目的顺从。</span>仿写：我父母更看重的是＿＿＿＿，而不是＿＿＿＿。" },
      { k:"正是…让我", html:"<span class=\"pat\">正是……，让我……</span>强调原因，再<b>连回你自己</b>——家怎样影响了你。<span class=\"src\"><b>正是</b>这种包容的环境，<b>让我</b>性格变得特别开朗。</span>" },
      { k:"有了…就能", html:"<span class=\"pat\">有了……，我就能……</span>从「家」连到「<b>未来</b>」，结尾格局更大。<span class=\"src\"><b>有了</b>家人的支持，<b>我就能</b>更有信心去迎接高考甚至未来的各种挑战。</span>" },
      { k:"凡事都要", html:"<span class=\"pat\">凡事都要……</span>转述父母的<b>教导</b>。<span class=\"src\">他们总是鼓励我，<b>凡事都要</b>有自己的见解。</span>" },
      { k:"俗话说…嘛", html:"<span class=\"pat\">俗话说／就像老话说的，“……”嘛</span>引<u class=\"wd\" data-w=\"俗语\">俗语</u>，句尾加「嘛」就不像在背书。<span class=\"src\"><b>就像老话说的</b>，“家和万事兴”<b>嘛</b>。</span>" }
    ] },

    { type:"culture", title:"二、打破「背诵腔」", sub:"考试是「说」——背出来的稿子，考官一听就知道", facts:[
      { k:"看差别", html:"<div class=\"up\"><div class=\"lv1\"><span class=\"tag\">背诵腔</span>我出生在一个典型的华裔家庭。我家的氛围是中西合璧。</div><div class=\"lv2\"><span class=\"tag\">像在说话</span><b>其实吧</b>，我出生在一个<b>挺</b>典型的华裔家庭。<b>怎么说呢</b>，家里的氛围就是大家常说的“中西合璧”。</div></div>" },
      { k:"五个语气词", html:"· <b>其实吧</b>：开头，引出真实想法<br>· <b>怎么说呢</b>：边想边说，给自己一秒钟<br>· <b>说白了</b>：把复杂的话简单地总结<br>· <b>挺……的</b>：口语里的「很」<br>· <b>……嘛</b>：句尾，表示「道理很明显」"+
        "<small class=\"en\">其实吧 opens with what you really think · 怎么说呢 buys you a second to think · 说白了 sums things up simply · 挺……的 is the spoken “quite / pretty” · 嘛 at the end means “…obviously / you know”.</small>" },
      { k:"地道表达", html:"<div class=\"up\"><div class=\"lv1\"><span class=\"tag\">普通</span>我们全家常常一起聊天。</div><div class=\"lv2\"><span class=\"tag\">更生活化</span>我们全家就坐在一起<b>天南地北地乱聊</b>。</div></div>" },
      { k:"⚠️ 分寸", html:"语气词<b>一篇用 2–3 个就够</b>。每句都加「其实吧」「嘛」，反而像在演戏。"+
        "<small class=\"en\">⚠️ <b>2–3 fillers per script is enough.</b> Put one in every sentence and it sounds like acting.</small>" }
    ] },

    { type:"speak", title:"三、动手写 · 你家是「中」还是「西」？",
      sub:"考官追问：“你觉得你的家庭比较传统，还是比较西方？”",
      frame:"① 用「<b>一方面……另一方面又……</b>」说说你家的两面：<br>＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿。<br><br>"+
            "② 用「<b>不但不……反而……</b>」说一件父母让你意外的做法：<br>＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿。<br><br>"+
            "③ 用「<b>正是……让我……</b>」说这个家怎样影响了你：<br>＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿。<br><br>"+
            "④ 在 ① 前面加一个<b>语气词</b>，再读一遍，听听有什么不同。",
      bank:["一方面","另一方面","不但不","反而","正是","让我","更看重的是","而不是",
            "其实吧","怎么说呢","说白了","中西合璧","百善孝为先","讲究","民主","包容",
            "独立思考","盲目顺从","平等的交流","沟通","家和万事兴"],
      eg:"<b>参考答案</b>：① 其实吧，我家一方面讲究尊重长辈，另一方面又很民主，大事小事都会一起商量。<br>② 选科目的时候，我爸妈不但不替我做决定，反而鼓励我自己想清楚再选。<br>③ 正是这种包容的氛围，让我变得更自信，也更敢说出自己的想法。"
    },

    { type:"quiz", title:"四、句型小测 · Quiz", sub:"选出最像 SLA 的那一句", questions:[
      { ask:"① 我家里＿＿讲究“百善孝为先”，＿＿又非常民主。",
        options:["要么……要么……","一方面……另一方面……","不但不……反而……"], answer:1 },
      { ask:"② 我爸妈＿＿要求我盲目顺从，＿＿鼓励我独立思考。",
        options:["不但不……反而……","一方面……另一方面……","有了……就……"], answer:0 },
      { ask:"③ 周末我们＿＿去打球，＿＿坐在一起聊天。",
        options:["正是……让我……","不但不……反而……","要么……要么……"], answer:2 },
      { ask:"④ ＿＿这种包容的环境，＿＿性格变得特别开朗。",
        options:["正是……让我……","要么……要么……","虽然……但是……"], answer:0 },
      { ask:"⑤ 「我父母更看重的是平等的交流，而不是盲目的顺从。」这句话讲的是——",
        options:["父母的职业","家里的价值观和取舍","周末的活动"], answer:1 },
      { ask:"⑥ 下面哪句最不像在背书？",
        options:["我的家庭是一个典型的华裔家庭。","典型的华裔家庭是我的家庭。","其实吧，我出生在一个挺典型的华裔家庭。"], answer:2 },
      { ask:"⑦ 「就像老话说的，“家和万事兴”嘛」里的「嘛」表示——",
        options:["疑问","道理很明显，大家都知道","命令"], answer:1 },
      { ask:"⑧ VCAA 要求 SLA 考生避免什么？",
        options:["只讲事实、没有个人见解","使用俗语","说得太自然"], answer:0 }
    ] }

  ]
};
</script>
