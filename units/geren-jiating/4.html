    { type:"culture", title:"这一节做什么 · What to do", sub:"👆 带下划线的词可以点，看拼音和英文解释", facts:[

        "<small class=\"en\">⚠️ <b>Do not pile them on.</b> In a 200-character script, <b>1–2 sayings is plenty</b>, and they must feel natural.</small>" },
      { k:"语气词", html:"第五组是口语<u class=\"wd\" data-w=\"语气词\">语气词</u>（其实吧、怎么说呢、嘛……）。它们没有「高级」的意思，作用是打破<u class=\"wd\" data-w=\"背诵腔\">背诵腔</u>，让你听起来是在<b>说话</b>，不是在<b>背书</b>。"+

  ]
