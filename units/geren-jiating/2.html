<script>
window.LESSON = {
  id:"geren-jiating-2", n:2, unit:"geren-jiating",
  unitTitle:"Unit 1 个人情况 ·（四）介绍家庭",
  title:"句式 · 基础 SL",
  subtitle:"别再「我家有四个人。爸爸是医生。」——把家人串成一段话",
  sections:[

    { type:"culture", title:"为什么要学句型 · Why patterns matter", sub:"👆 带下划线的词可以点，看拼音和英文解释", facts:[
      { k:"问题", html:"很多同学介绍家庭是这样的：<br><span class=\"wrong\">我家有四个人。爸爸是工程师。他很忙。妈妈是老师。她会做菜。</span><br>像在报<u class=\"wd\" data-w=\"流水账\">流水账</u>——<u class=\"wd\" data-w=\"考官\">考官</u>听到的是<b>一张名单</b>，听不出这是一个什么样的家。"+
        "<small class=\"en\">Many students introduce their family like this. It sounds like a list — the examiner hears <b>a roll call</b>, not what kind of family this is.</small>" },
      { k:"办法", html:"用<u class=\"wd\" data-w=\"关联词\">关联词</u>把「职业」和「他为家做了什么」连在一起：<br><span class=\"right\">爸爸是一名工程师，<b>尽管</b>平时工作很忙，<b>也总是</b>在周末抽出时间陪伴我们。</span>"+
        "<small class=\"en\">Use <b>connectives</b> to link a person's job with what they do for the family: “Dad is an engineer; <b>even though</b> he is busy, he <b>always</b> makes time for us at weekends.”</small>" },
      { k:"目标", html:"下面十一个<u class=\"wd\" data-w=\"句型\">句型</u>全部来自课文一，按介绍家庭的顺序排好了：<b>成员 → 职业 → <u class=\"wd\" data-w=\"互动\">互动</u> → 感受</b>。<b>能熟练用五个就够了。</b>"+
        "<small class=\"en\">All eleven patterns below come from Text 1, in the order of a family introduction: members → jobs → doing things together → feelings. <b>Five used fluently is enough.</b></small>" }
    ] },

    { type:"culture", title:"一、家里有谁", facts:[
      { k:"一共…口人", html:"<span class=\"pat\">我有一个……的家庭，一共……口人：……</span>一句话讲清<b>家的感觉 + 人数 + 成员</b>。<span class=\"src\">我有一个温暖的家庭，<b>一共</b>四<b>口人</b>：爸爸、妈妈、姐姐和我。</span>⚠️ 数家里的人用<u class=\"wd\" data-w=\"量词\">量词</u>「口」。<br>仿写：我有一个＿＿＿＿的家庭，一共＿＿口人：＿＿＿＿。" },
      { k:"是一名／一位", html:"<span class=\"pat\">……是一名／一位……</span>介绍职业。「位」带尊敬，说老师、长辈更有礼貌。<span class=\"src\">爸爸<b>是一名</b>工程师；妈妈<b>是一位</b>老师。</span><span class=\"wrong\">我的爸爸工作在医院。</span> → <span class=\"right\">我爸爸是一名医生，在医院工作。</span>" }
    ] },

    { type:"culture", title:"二、家人做什么、是什么样的人", facts:[
      { k:"尽管…也总是", html:"<span class=\"pat\">尽管……，也总是……</span>先说一个<b>困难</b>，再说他<b>仍然</b>为家做了什么——一下子就有了感情。<span class=\"src\">爸爸是一名工程师，<b>尽管</b>平时工作很忙，<b>也总是</b>在周末抽出时间陪伴我们。</span>仿写：＿＿尽管＿＿＿＿，也总是＿＿＿＿。" },
      { k:"不仅…还", html:"<span class=\"pat\">不仅……，还……</span>一个人的<b>两个优点</b>。<span class=\"src\">妈妈是一位老师，<b>不仅</b>关心我们的学习，<b>还</b>会做很多好吃的饭菜。</span>" },
      { k:"虽然…却", html:"<span class=\"pat\">……虽然……，却……</span>说<b>不一样</b>，也说<b>一样</b>。⚠️ 两半句是同一个主语时，主语放在「虽然」前面，「却」放在动词前面。<span class=\"src\">我们<b>虽然</b>性格不一样，<b>却</b>也有很多相同的爱好。</span>仿写：我和＿＿虽然＿＿＿＿，却＿＿＿＿。" }
    ] },

    { type:"culture", title:"三、全家一起做什么", facts:[
      { k:"虽然…但", html:"<span class=\"pat\">虽然平时……，但……</span>从「各忙各的」转到「一家人在一起」。<span class=\"src\">我们一家人<b>虽然</b>平时都忙忙碌碌的，<b>但</b>每逢节假日，我们都会去郊外旅游。</span>" },
      { k:"每逢…都", html:"<span class=\"pat\">每逢……，都……</span>讲一家人的<b>习惯</b>，比「每个周末」更好听。<span class=\"src\"><b>每逢</b>节假日，我们<b>都</b>会去郊外旅游。</span>仿写：每逢＿＿＿＿，我们全家都会＿＿＿＿。" },
      { k:"享受…时光", html:"<span class=\"pat\">享受……的时光</span>给活动加一句<b>感受</b>。<span class=\"src\"><b>享受</b>一家人在一起的幸福<b>时光</b>。</span>" }
    ] },

    { type:"culture", title:"四、你对家的感受", facts:[
      { k:"家就像", html:"<span class=\"pat\">家就像……</span>用<u class=\"wd\" data-w=\"比喻\">比喻</u>说出看不见的感觉。<span class=\"src\">我觉得<b>家就像</b>一个温暖的港湾。</span>也可以说：家就像一棵大树，为我挡风遮雨。" },
      { k:"不管…只要…就", html:"<span class=\"pat\">不管……，只要……，就……</span>把比喻讲清楚：<b>不管</b>什么情况，<b>只要</b>满足一个条件，<b>就</b>会有结果。<span class=\"src\"><b>不管</b>在外面遇到什么风雨，<b>只要</b>回到家，<b>就</b>会感到安心和温暖。</span>" },
      { k:"很爱…也很珍惜", html:"<span class=\"pat\">我很爱……，也很珍惜……</span>结尾必备，一句话收住全篇。<span class=\"src\">我<b>很爱</b>我的家人，<b>也很珍惜</b>我们在一起的每一天。</span><span class=\"wrong\">我觉得我的家很好。</span> ← 太空了，没有感情。" }
    ] },

    { type:"speak", title:"五、连词成句 · 用句型说你的家",
      sub:"从下面的词库里挑词，把句子补完整（照实说你自己的家）",
      frame:"① 我有一个＿＿＿＿的家庭，一共＿＿口人：＿＿＿＿＿＿。<br><br>"+
            "② 我爸爸／妈妈是一名／一位＿＿＿＿，尽管平时＿＿＿＿，也总是＿＿＿＿。<br><br>"+
            "③ ＿＿＿＿不仅＿＿＿＿，还＿＿＿＿。<br><br>"+
            "④ 我和＿＿虽然＿＿＿＿，却＿＿＿＿。<br><br>"+
            "⑤ 每逢＿＿＿＿，我们全家都会＿＿＿＿，享受＿＿＿＿的时光。<br><br>"+
            "⑥ 我觉得家就像＿＿＿＿，不管＿＿＿＿，只要＿＿＿＿，就＿＿＿＿。",
      bank:["温暖","幸福","热闹","三","四","五",
            "工程师","老师","医生","护士","会计","公司职员",
            "工作很忙","经常加班","抽出时间陪伴我们","关心我的学习","会做好吃的饭菜",
            "性格不一样","有很多相同的爱好","周末","节假日","春节",
            "去郊外旅游","一起包饺子","去海边散步","一起看电影",
            "一个温暖的港湾","一棵大树","遇到什么困难","回到家","感到安心"],
      eg:"<b>写完读一遍</b>：如果一口气读下来不喘、不打结，说明句子长度合适；如果读得上气不接下气，就把它拆成两句。"
    },

    { type:"quiz", title:"六、选一选：该用哪个关联词？", sub:"每题只有一个最自然的答案", questions:[
      { ask:"① ＿＿平时工作很忙，爸爸＿＿总是在周末陪伴我们。",
        options:["尽管……也……","因为……所以……","不仅……还……"], answer:0 },
      { ask:"② 妈妈＿＿关心我们的学习，＿＿会做很多好吃的饭菜。",
        options:["虽然……却……","不仅……还……","不管……只要……"], answer:1 },
      { ask:"③ 我和姐姐＿＿性格不一样，＿＿有很多相同的爱好。",
        options:["虽然……却……","不仅……还……","每逢……都……"], answer:0 },
      { ask:"④ ＿＿节假日，我们＿＿会去郊外旅游。",
        options:["虽然……但……","每逢……都……","尽管……也……"], answer:1 },
      { ask:"⑤ ＿＿在外面遇到什么风雨，＿＿回到家，就会感到安心。",
        options:["不管……只要……","不仅……还……","虽然……却……"], answer:0 },
      { ask:"⑥ 下面哪句最自然？",
        options:["我的爸爸是一个工程师。","我爸爸是一名工程师。","我爸爸工程师是。"], answer:1 },
      { ask:"⑦ 「我们虽然性格不一样，却也有很多相同的爱好。」这里的「却」放在——",
        options:["句子最前面","主语后面、动词前面","句子最后"], answer:1 },
      { ask:"⑧ 「家就像一个温暖的港湾」用了什么手法？",
        options:["比喻","反问","排比"], answer:0 },
      { ask:"⑨ 介绍家庭的结尾，哪一句最好？",
        options:["我觉得我的家很好。","我很爱我的家人，也很珍惜我们在一起的每一天。","就这样。"], answer:1 }
    ] }

  ]
};
</script>
