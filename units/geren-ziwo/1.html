      { k:"目标", html:"这五组词对应课堂练习表格的五个格子：<u class=\"wd\" data-w=\"性格\">性格</u> / 优点 / <u class=\"wd\" data-w=\"缺点\">缺点</u> / <u class=\"wd\" data-w=\"兴趣爱好\">兴趣爱好</u> / <u class=\"wd\" data-w=\"理想\">理想</u>职业。学完挑出<b>适合描述你自己</b>的词，填进表格并<u class=\"wd\" data-w=\"仿写\">仿写</u>造句。"+
        "<small class=\"en\">These five groups match the five boxes in your worksheet: personality, strengths, weaknesses, hobbies, and future career. Afterwards, pick the words that really describe <b>you</b>, write them in the table, and make your own sentences.</small>" },

    { type:"vocab", title:"一、性格 Personality", sub:"描述你是个什么样的人", words:[

      { hz:"内向",     zh:"我比较内向，人多的时候不太爱说话。" },
      { hz:"安静",     zh:"我喜欢安静，最爱一个人待在图书馆。" },
      { hz:"随和",     zh:"我性格随和，跟谁都合得来。" },
      { hz:"勇敢",     zh:"他很勇敢，第一个举手上台演讲。" },

      { hz:"主动",       zh:"他在课堂上很主动，经常回答问题。" },
      { hz:"合作能力强", zh:"他合作能力强，很适合小组活动。" }

    { type:"vocab", title:"三、缺点 Weaknesses", sub:"“人无完人”——大方地说出来，是加分项", words:[
      { hz:"马虎",       zh:"我做事有点马虎，常常看错题目。" },

      { hz:"体育迷",     zh:"我更是一个“体育迷”，尤其热爱打篮球。" },
      { hz:"锻炼身体",   zh:"打球不仅能锻炼身体，还能放松心情。" },
      { hz:"放松心情",   zh:"每到周末去打球，能让我放松心情。" },
      { hz:"体育馆",     zh:"每到周末，我都会和朋友们去体育馆打球。" },

      { hz:"多才多艺",   zh:"她多才多艺，会跳舞也会画画。" }
    ] },

    { type:"vocab", title:"五、理想 · 专业与职业 Aspirations", sub:"课文句式：我希望能考上……，学习……专业", words:[
      { hz:"理想",       zh:"关于未来的理想，我希望能考上一所好大学。" },
      { hz:"专业",       zh:"我想学习计算机人工智能专业。" },
      { hz:"人工智能",   zh:"因为我对科技很感兴趣，所以想学人工智能。" },
      { hz:"软件工程师", zh:"软件工程师在科技行业中很受欢迎。" },
      { hz:"数据分析师", zh:"数据分析师需要很强的逻辑思维能力。" },
      { hz:"建筑师",     zh:"他将来想当一名建筑师，设计环保的建筑。" },
      { hz:"心理学家",   zh:"她对心理学很感兴趣，希望成为心理学家。" },
      { hz:"医生",       zh:"我的理想职业是当一名医生，帮助更多的人。" },

      { hz:"媒体工作者", zh:"媒体工作者需要良好的沟通能力。" },
      { hz:"商科",       zh:"很多学生选择商科作为大学专业。" },
      { hz:"金融",       zh:"他希望将来从事金融行业。" },
      { hz:"会计",       zh:"会计需要细心和责任感。" },
      { hz:"工程学",     zh:"他在大学主修工程学。" },
      { hz:"环境科学",   zh:"环境科学是一个越来越重要的专业。" }
    ] },

    { type:"quiz", title:"六、挑一挑：哪个词更合适？", sub:"选出最贴切的那一个", questions:[
      { ask:"① 他考试前会把笔和尺子检查三遍，生怕出错。他的性格是——",
        options:["谨慎","大大咧咧","冲动"], answer:0 },
      { ask:"② 丽丽不喜欢热闹的派对，更愿意一个人在房间里看书。她的性格是——",
        options:["外向","内向","情绪化"], answer:1 },
      { ask:"③ 每次学校组织活动，张强总是第一个报名，还主动去认识新同学。他——",
        options:["胆小","乐于助人","开朗又主动"], answer:2 },
      { ask:"④ “我每天练琴，从来不放弃。”这说明他——",
        options:["有毅力","容易放弃","拖延"], answer:0 },
      { ask:"⑤ 课文里说“我也有弱点，比如做事马虎”。“马虎”的意思是——",
        options:["很努力","不细心","很安静"], answer:1 },
      { ask:"⑥ “爱好”的正确读音是——",
        options:["ài hǎo","ài hào","ài hāo"], answer:1 }
    ] }

  ]
};
