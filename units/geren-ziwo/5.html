<script>
window.LESSON = {
  id:"geren-ziwo-5", n:5, unit:"geren-ziwo",
  unitTitle:"Unit 1 个人情况 ·（一）介绍自己",
  title:"句式 · 进阶 SLA",
  subtitle:"从「说清楚」到「说得好」",
  sections:[

    { type:"culture", title:"SLA 到底比 SL 多了什么？", sub:"👆 带下划线的词可以点，看拼音和英文解释", facts:[
      { k:"VCAA 的话", html:"<u class=\"wd\" data-w=\"评分标准\">评分</u>报告要求 SLA 考生避免 <b>“Factual Information Only”</b>——只报事实不行，要有<u class=\"wd\" data-w=\"个人见解\">个人见解</u>和<u class=\"wd\" data-w=\"画面感\">画面感</u>。"+
        "<small class=\"en\">The VCAA report tells SLA candidates to avoid giving <b>factual information only</b>. Stating facts is not enough — you need <b>your own insight</b> and <b>vivid detail</b>.</small>" },
      { k:"看差别", html:"<div class=\"up\"><div class=\"lv1\"><span class=\"tag\">SL 普通回答</span>我是一个外向的人。我喜欢说话，我有很多朋友。</div><div class=\"lv2\"><span class=\"tag\">SLA 升级</span>我<b>不但</b>性格乐观豁达，<b>而且</b>非常健谈。每次在聚会上，我总是<b>侃侃而谈</b>，朋友们都说我是大家的“<b>开心果</b>”。</div></div>" },
      { k:"三个动作", html:"① 用<u class=\"wd\" data-w=\"关联词\">关联词</u>把短句变长句 ② 补一个<u class=\"wd\" data-w=\"具体\">具体</u>行为（在聚会上、<u class=\"wd\" data-w=\"侃侃而谈\">侃侃而谈</u>）③ 加一个<b>别人的评价</b>或<b>比喻</b>（大家的<u class=\"wd\" data-w=\"开心果\">开心果</u>）"+
        "<small class=\"en\">Three moves: ① use <b>connectives</b> to turn short sentences into long ones ② add a <b>concrete behaviour</b> (at a party, talking away confidently) ③ add <b>someone else's view of you</b> or a <b>metaphor</b> (everyone's “pistachio”).</small>" }
    ] },

    { type:"culture", title:"一、六组「基础 → 升级」对照", sub:"同一个意思，两种说法（全部来自课文一 vs 课文二）", facts:[
      { k:"讲身份", html:"<div class=\"up\"><div class=\"lv1\"><span class=\"tag\">基础</span>我是华裔澳大利亚人。</div><div class=\"lv2\"><span class=\"tag\">升级</span>独特的成长经历让我成为了一个典型的“<b>中西合璧</b>”的华裔少年。</div></div>" },
      { k:"讲性格", html:"<div class=\"up\"><div class=\"lv1\"><span class=\"tag\">基础</span>熟悉我的人都说我是一个性格开朗、幽默的男孩。</div><div class=\"lv2\"><span class=\"tag\">升级</span>熟悉我的人都说我是一个<b>乐观豁达</b>的“<b>乐天派</b>”。</div></div>" },
      { k:"讲爱好", html:"<div class=\"up\"><div class=\"lv1\"><span class=\"tag\">基础</span>我也有很多的兴趣爱好。</div><div class=\"lv2\"><span class=\"tag\">升级</span>在兴趣爱好方面，我可以说是“<b>动静结合</b>”。</div></div>" },
      { k:"讲好处", html:"<div class=\"up\"><div class=\"lv1\"><span class=\"tag\">基础</span>运动不仅能锻炼身体，还能放松心情。</div><div class=\"lv2\"><span class=\"tag\">升级</span>运动不仅<b>强健</b>了我的<b>体魄</b>，而且让我在紧张的学习<b>之余</b>得到了放松。</div></div>" },
      { k:"讲兴趣", html:"<div class=\"up\"><div class=\"lv1\"><span class=\"tag\">基础</span>我对音乐感兴趣。</div><div class=\"lv2\"><span class=\"tag\">升级</span>音乐对我来说，是一种<b>陶冶情操</b>的最好方式。</div></div>" },
      { k:"讲缺点", html:"<div class=\"up\"><div class=\"lv1\"><span class=\"tag\">基础</span>不过，我也有弱点。</div><div class=\"lv2\"><span class=\"tag\">升级</span>不过，俗话说“<b>金无足赤，人无完人</b>”，我也有自己的<b>短处</b>。</div></div>" }
    ] },

    { type:"culture", title:"二、SLA 必背句型", sub:"能熟练用三个，稿子的档次就上来了", facts:[
      { k:"既…又…", html:"<span class=\"pat\">既……又……</span>平衡<b>两个看似矛盾</b>的特点——这正是华裔身份最好的表达方式。<span class=\"src\">我<b>既</b>深受中国传统文化的熏陶，<b>又</b>拥有澳大利亚人热情、随和的特质。</span>仿写：我既＿＿＿＿，又＿＿＿＿。" },
      { k:"不仅…而且…", html:"<span class=\"pat\">不仅……，而且……</span>比「不仅……还……」更书面、更有力。<span class=\"src\">运动<b>不仅</b>强健了我的体魄，<b>而且</b>让我在紧张的学习之余得到了放松。</span>" },
      { k:"与其…不如…", html:"<span class=\"pat\">与其……，不如……</span>带<b>强烈倾向性</b>，用来表达取舍和个人观点，是 SLA 的杀手锏。<span class=\"src\">在墨尔本迷人的周末，<b>与其</b>把自己关在房间里没完没了地刷题，<b>不如</b>去海边冲浪，让清凉的海风吹走所有的烦恼。</span>" },
      { k:"每逢…都…", html:"<span class=\"pat\">每逢……，都……</span>讲<b>习惯</b>比「每到」更文雅。<span class=\"src\"><b>每逢</b>周末，我<b>都</b>会和三五好友去体育馆切磋球技。</span>" },
      { k:"由于…", html:"<span class=\"pat\">由于……</span>书面版的「因为」，讲<b>客观原因</b>时用。<span class=\"src\"><b>由于</b>中西文化的差异，我和父母之间偶尔会有代沟。</span>" },
      { k:"一边…一边…", html:"<span class=\"pat\">一边……，一边……</span>两件事<b>同时</b>做。<span class=\"src\">我喜欢<b>一边</b>听音乐，<b>一边</b>做作业。</span>" }
    ] },

    { type:"culture", title:"三、告别「我喜欢…」", sub:"整篇稿子都用“我喜欢”，考官会听腻", facts:[
      { k:"看书", html:"<div class=\"up\"><div class=\"lv1\"><span class=\"tag\">基础</span>我喜欢看书。</div><div class=\"lv2\"><span class=\"tag\">升级</span>我<b>热衷于</b>阅读各种类型的书籍。</div></div>" },
      { k:"音乐", html:"<div class=\"up\"><div class=\"lv1\"><span class=\"tag\">基础</span>我喜欢音乐。</div><div class=\"lv2\"><span class=\"tag\">升级</span>音乐是我生活中<b>不可或缺</b>的一部分。</div></div>" },
      { k:"旅游", html:"<div class=\"up\"><div class=\"lv1\"><span class=\"tag\">基础</span>我喜欢旅游。</div><div class=\"lv2\"><span class=\"tag\">升级</span>旅行让我<b>开阔眼界</b>、增长见识。</div></div>" },
      { k:"运动", html:"<div class=\"up\"><div class=\"lv1\"><span class=\"tag\">基础</span>我喜欢运动。</div><div class=\"lv2\"><span class=\"tag\">升级</span>运动不仅<b>强身健体</b>，也让我<b>释放压力</b>。</div></div>" },
      { k:"画画", html:"<div class=\"up\"><div class=\"lv1\"><span class=\"tag\">基础</span>我喜欢画画。</div><div class=\"lv2\"><span class=\"tag\">升级</span>绘画让我<b>得以表达内心的情感</b>。</div></div>" }
    ] },

    { type:"culture", title:"四、高分技巧：Show, Don't Tell", sub:"看不见的东西，用看得见的画面说出来", facts:[
      { k:"示范", html:"要写「<b>我喜欢弹吉他</b>」——<br>· <b>原因</b>：在波涛翻滚的学海中，吉他就是我的<b>避风港</b>。<br>· <b>画面</b>：手指拨动琴弦的瞬间，那些烦人的数学公式都烟消云散了。<br>· <b>故事</b>：虽然父母更希望我把时间花在考医的理想上，但我认为音乐能陶冶情操。<br>· <b>总结</b>：弹吉他就是我在学业压力与心灵寄托之间寻找平衡的<b>支点</b>。" },
      { k:"公式", html:"抽象的性格词 → 换成<b>一个具体动作</b>。<div class=\"up\"><div class=\"lv1\"><span class=\"tag\">Tell（干巴巴）</span>我很有毅力，我每天都练琴，从来不放弃。</div><div class=\"lv2\"><span class=\"tag\">Show（有画面）</span>为了准备钢琴八级考试，我每天清晨五点就起床练琴，至少练三个小时，无论多忙多累都<b>雷打不动</b>。</div></div>" },
      { k:"再来一个", html:"<div class=\"up\"><div class=\"lv1\"><span class=\"tag\">Tell</span>我这个人比较马虎，经常忘记带东西。</div><div class=\"lv2\"><span class=\"tag\">Show</span>俗话说“人无完人”，我最大的毛病就是马虎。记得有一次考试，我<b>竟然忘了把名字写在答题纸上</b>，结果被扣了五分，真是欲哭无泪。</div></div>" },
      { k:"比喻", html:"用<b>熟悉的东西</b>解释<b>抽象的感受</b>，一句话就有画面：<br>· 好朋友就像是<b>一盏灯</b>，在黑暗中给我温暖，在迷茫中指引方向。<br>· 家就像一个<b>温暖的港湾</b>，不管在外面遇到什么风雨，回到家就会安心。" }
    ] },

    { type:"speak", title:"五、动手写 · 中西文化碰撞",
      sub:"考官问：面对 VCE 升学压力，你的解压方式是什么？",
      frame:"<b>背景 A（澳洲生活方式）</b>：去海边冲浪、和朋友 BBQ、进行户外运动<br>"+
            "<b>背景 B（中国传统观念）</b>：在书房刷题、喝安神补脑汤、听父母的教导<br><br>"+
            "① 用「<b>与其……不如……</b>」表达你的选择（这个句型带强烈倾向性）：<br>＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿。<br><br>"+
            "② 用「<b>既……又……</b>」表达你“中西合璧”的特质（用来平衡两个看似矛盾的特点）：<br>＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿。<br><br>"+
            "③ 用「<b>不仅……而且……</b>」讲一个爱好带给你的<b>两样</b>东西：<br>＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿。",
      bank:["与其","不如","既","又","不仅","而且","每逢","由于","一边","热衷于","不可或缺","开阔眼界",
            "陶冶情操","强健体魄","释放压力","中西合璧","取长补短","乐观豁达","动静结合","雷打不动"],
      eg:"<b>参考答案</b>：① 在墨尔本迷人的周末，与其把自己关在房间里没完没了地刷题，不如去海边冲浪，让清凉的海风吹走所有的烦恼。<br>② 面对升学压力，我既保留了中国学生勤奋刻苦的优良传统，又学会了像澳洲本地人一样通过运动来调节心态。"
    },

    { type:"quiz", title:"六、句型小测 · Quiz", sub:"选出最像 SLA 的那一句", questions:[
      { ask:"① 要表达「我又有中国的一面，又有澳洲的一面」，最好用——",
        options:["因为……所以……","既……又……","虽然……但是……"], answer:1 },
      { ask:"② 「与其……不如……」这个句型的作用是——",
        options:["表达强烈的倾向和取舍","表示时间先后","表示因果关系"], answer:0 },
      { ask:"③ 下面哪一句是 SLA 水平？",
        options:["我喜欢音乐。","音乐是我生活中不可或缺的一部分。","音乐很好听。"], answer:1 },
      { ask:"④ 「我很有毅力」怎么说才有画面感（Show, Don't Tell）？",
        options:["我非常非常有毅力。","我每天清晨五点起床练琴，无论多忙都雷打不动。","别人都说我有毅力。"], answer:1 },
      { ask:"⑤ 「每逢周末，我都会和三五好友去切磋球技」比「我周末和朋友打球」好在哪？",
        options:["更长","用了更文雅的词，还讲出了习惯","意思不一样"], answer:1 },
      { ask:"⑥ VCAA 要求 SLA 考生避免什么？",
        options:["只讲事实、没有个人见解","写得太长","使用成语"], answer:0 },
      { ask:"⑦ 「由于中西文化的差异，我和父母之间有代沟。」这里的「由于」相当于——",
        options:["虽然","因为","除了"], answer:1 },
      { ask:"⑧ 「好朋友就像是一盏灯」这句话用了什么手法？",
        options:["比喻","反问","排比"], answer:0 }
    ] }

  ]
};
</script>
