.pat{display:block;font-size:17px;font-weight:700;color:var(--blue-d);margin-bottom:3px}
.src{display:block;background:#f5f8ff;border-left:3px solid var(--blue);padding:6px 10px;border-radius:0 8px 8px 0;margin:5px 0}
.wrong{color:#c0392b;text-decoration:line-through}
.right{color:#1e8449;font-weight:600}
/* 说明文字的整句英文小字注解 */
small.en{display:block;margin-top:6px;color:#5a6472;font-size:12.5px;line-height:1.5}

<script src="../../assets/catalog.js"></script>

<script>
window.LESSON = {
  id:"geren-ziwo-2", n:2, unit:"geren-ziwo",
  unitTitle:"Unit 1 个人情况 ·（一）介绍自己",
  title:"句式 · 基础 SL",
  subtitle:"把短句串成长句——这是从及格到高分的第一步",
  sections:[

    { type:"culture", title:"为什么要学句型 · Why patterns matter", sub:"👆 带下划线的词可以点，看拼音和英文解释", facts:[
      { k:"问题", html:"很多同学的自我介绍是这样的：<br><span class=\"wrong\">我十七岁。我很开朗。我喜欢篮球。我想当工程师。</span><br>每句都对，但像在报<u class=\"wd\" data-w=\"流水账\">流水账</u>——<u class=\"wd\" data-w=\"考官\">考官</u>听到的是<b>一串短句</b>，不是一段话。"+
        "<small class=\"en\">Many students' self-introductions look like this. Every sentence is correct, but it reads like a shopping list — the examiner hears <b>a string of short sentences</b>, not a paragraph.</small>" },
      { k:"办法", html:"用<u class=\"wd\" data-w=\"关联词\">关联词</u>把短句连起来，句子就有了逻辑：<br><span class=\"right\">我喜欢篮球，<b>因为</b>打球<b>不仅</b>能锻炼身体，<b>还</b>能放松心情。</span>"+
        "<small class=\"en\">Use <b>connectives</b> to join the short sentences, and the sentence gains logic: “I like basketball, <b>because</b> playing <b>not only</b> keeps me fit <b>but also</b> helps me relax.”</small>" },
      { k:"目标", html:"下面十一个<u class=\"wd\" data-w=\"句型\">句型</u>全部来自课文。<b>能熟练用五个，你的口语稿就够用了。</b>"+
        "<small class=\"en\">All eleven sentence patterns below come from the text. <b>If you can use five of them fluently, that is enough for your speaking script.</b></small>" }
    ] },

    { type:"culture", title:"一、介绍身份和背景", facts:[
      { k:"是…的", html:"<span class=\"pat\">我是……的</span>强调<b>时间 / 地点 / 方式</b>（when / where / how）。<span class=\"src\">我<b>是</b>五岁时随父母来澳大利亚<b>的</b>。</span>仿写：我是＿＿＿＿出生的。" },
      { k:"所以", html:"<span class=\"pat\">……，所以……</span>先讲原因，再讲结果。<span class=\"src\">我出生在中国，五岁时随父母来到澳大利亚，<b>所以</b>我是华裔澳大利亚人。</span>仿写：我＿＿＿＿，所以＿＿＿＿。" }
    ] },

    { type:"culture", title:"二、介绍性格", facts:[
      { k:"熟悉…的人", html:"<span class=\"pat\">熟悉我的人都说我是一个……的人</span>比直接说“我很开朗”自然得多，因为是<b>借别人的嘴</b>说自己。<span class=\"src\"><b>熟悉我的人都说</b>我是一个性格开朗、幽默的男孩。</span>" },
      { k:"总…所以", html:"<span class=\"pat\">我……，总……，所以……</span>先给性格标签，再补一个<b>具体表现</b>。<span class=\"src\">我说话很幽默，<b>总</b>把人逗得哈哈大笑，<b>所以</b>朋友们和我在一起总是很开心。</span>" }
    ] },

    { type:"culture", title:"三、介绍兴趣爱好", facts:[
      { k:"更是…尤其", html:"<span class=\"pat\">我有很多……，更是一个“……迷”，尤其热爱……</span>从<b>大范围</b>缩到<b>小范围</b>，一句话讲三层。<span class=\"src\">我也有很多的兴趣爱好，<b>更是</b>一个“体育迷”，<b>尤其</b>热爱打篮球和游泳。</span>" },
      { k:"不仅…还", html:"<span class=\"pat\">不仅……，还……</span>讲一件事的<b>两个好处</b>，是最好用的加分句型。<span class=\"src\">打球<b>不仅</b>能锻炼身体，<b>还</b>能放松心情。</span>仿写：学中文不仅＿＿＿＿，还＿＿＿＿。" },
      { k:"除了…也", html:"<span class=\"pat\">除了……，我也……</span>补充<b>另一个</b>方面，避免只说一件事。<span class=\"src\"><b>除了</b>运动，我<b>也</b>对音乐感兴趣。</span>" },
      { k:"对…感兴趣", html:"<span class=\"pat\">我对……感兴趣</span>⚠️ 英文是 <i>interested <b>in</b></i>，中文<b>必须</b>是「对……感兴趣」。<br><span class=\"wrong\">我非常感兴趣在音乐。</span> → <span class=\"right\">我对音乐非常感兴趣。</span>" }
    ] },

    { type:"culture", title:"四、介绍缺点（“人无完人”）", facts:[
      { k:"不过", html:"<span class=\"pat\">不过，……</span>说完优点转到缺点，语气就不生硬。<span class=\"src\"><b>不过</b>，人无完人，我也有弱点。</span>" },
      { k:"比如", html:"<span class=\"pat\">……，比如……</span>说了缺点就要<b>举例子</b>，否则太空。<span class=\"src\">我也有弱点，<b>比如</b>做事马虎，自律性也不够好。</span>" },
      { k:"虽然…但是", html:"<span class=\"pat\">虽然……，但是……</span>承认不足，再表示会改——考官很吃这一套。<span class=\"src\">虽然我偶尔有点懒惰，<b>但是</b>我正努力变得更自律。</span>" }
    ] },

    { type:"culture", title:"五、介绍理想", facts:[
      { k:"希望能", html:"<span class=\"pat\">我希望能……，学习……专业</span><span class=\"src\">我<b>希望能</b>考上一所好大学，<b>学习</b>计算机人工智能<b>专业</b>。</span>" },
      { k:"因为", html:"<span class=\"pat\">因为……，我……</span>理想一定要<b>给理由</b>，不然像随口说的。<span class=\"src\"><b>因为</b>我对科技很感兴趣，<b>我</b>相信科技能改变未来的生活。</span>" },
      { k:"这就是我", html:"<span class=\"pat\">这就是我，一个……的男孩／女孩</span>结尾必备，一句话收住全篇。<span class=\"src\"><b>这就是我，一个</b>阳光自信又很幽默<b>的男孩</b>。</span>" }
    ] },

    { type:"speak", title:"六、连词成句 · 用句型说自己",
      sub:"从下面的词库里挑词，把句子补完整",
      frame:"① 我也有很多的兴趣爱好，更是一个「＿＿＿＿迷」，尤其热爱＿＿＿＿。<br><br>"+
            "② ＿＿＿＿不仅能＿＿＿＿，还能＿＿＿＿。<br><br>"+
            "③ 除了＿＿＿＿，我也对＿＿＿＿感兴趣。<br><br>"+
            "④ 不过，人无完人，我也有弱点，比如＿＿＿＿。<br><br>"+
            "⑤ 因为我对＿＿＿＿很感兴趣，我希望能考上大学，学习＿＿＿＿专业。<br><br>"+
            "⑥ 这就是我，一个＿＿＿＿的男孩／女孩。",
      bank:["体育","音乐","电影","科技","打篮球","游泳","跑步","弹吉他","弹钢琴","画画","摄影","编程",
            "锻炼身体","放松心情","开阔眼界","交到朋友",
            "做事马虎","有点拖延","不够专心","容易紧张",
            "计算机","人工智能","商科","医学","设计","环境科学",
            "阳光自信","开朗幽默","安静认真","随和乐观"],
      eg:"<b>写完读一遍</b>：如果一口气读下来不喘、不打结，说明句子长度合适；如果读得上气不接下气，就把它拆成两句。"
    },

    { type:"quiz", title:"七、选一选：该用哪个关联词？", sub:"每题只有一个最自然的答案", questions:[
      { ask:"① 打球＿＿能锻炼身体，＿＿能放松心情。",
        options:["因为……所以……","不仅……还……","虽然……但是……"], answer:1 },
      { ask:"② ＿＿运动，我＿＿对音乐感兴趣。",
        options:["除了……也……","不仅……还……","因为……所以……"], answer:0 },
      { ask:"③ 我对科技很感兴趣，＿＿我想学人工智能专业。",
        options:["不过","所以","除了"], answer:1 },
      { ask:"④ 我性格开朗，朋友很多。＿＿，人无完人，我也有缺点。",
        options:["因为","所以","不过"], answer:2 },
      { ask:"⑤ 下面哪句<b>不是</b>中式中文？",
        options:["我非常感兴趣在音乐。","我对音乐非常感兴趣。","我感兴趣音乐非常。"], answer:1 },
      { ask:"⑥ “我是五岁时来澳大利亚的。”这个句型强调的是——",
        options:["时间","地点","原因"], answer:0 },
      { ask:"⑦ 说完自己的缺点后，最好再加一句——",
        options:["就这样吧。","这些都是我需要改正的缺点。","我没有别的缺点了。"], answer:1 },
      { ask:"⑧ 下面哪个开头比“我很开朗”更自然、更像口语？",
        options:["我的性格是开朗。","熟悉我的人都说我性格开朗。","我是开朗的人。"], answer:1 }
    ] }

  ]
};
</script>
