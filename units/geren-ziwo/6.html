      { k:"第1段 身份", html:"<div class=\"up\"><div class=\"lv1\"><span class=\"tag\">课文一</span>五岁时随父母来到澳大利亚，所以我是华裔澳大利亚人。</div><div class=\"lv2\"><span class=\"tag\">课文二</span>五岁时随父母<b>移民</b>来到澳大利亚。<b>独特的成长经历</b>让我成为了一个<b>典型的“中西合璧”</b>的华裔少年，我<b>既</b>深受中国<b>传统文化的熏陶</b>，<b>又</b>拥有澳大利亚人热情、随和的<b>特质</b>。</div></div><small>👉 从「陈述事实」变成了「<b>解释这个事实塑造了什么样的我</b>」——这就是 Personal Insight。</small><small class=\"en\">👉 It has gone from <b>stating a fact</b> to <b>explaining what that fact made him</b> — that is Personal Insight.</small>" },
