<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VCE 中文</title>
<link rel="stylesheet" href="assets/style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f6feb">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="VCE中文">
</head>
<body>
<div class="topbar"><div class="row"><div class="brand" id="brand">VCE 中文</div><a href="teacher.html" style="background:rgba(255,255,255,.18);color:#fff;border-radius:20px;padding:5px 12px;font-size:13px;font-weight:500;white-space:nowrap">🔐 老师</a></div></div>
<div class="wrap">
  <div class="hero"><h1 id="siteTitle">VCE 中文</h1></div>
  <input class="search" id="search" placeholder="🔍 全站搜索：课题 / 主题 / 关键词…">
  <div class="chips" id="grades"></div>
  <div class="crumb" id="crumb"></div>
  <div id="list"></div>
  <p class="foot">学生自测练习</p>
</div>

<script src="assets/catalog.js"></script>
<script>
(function(){
  const C=window.CATALOG;
  const CN=["一","二","三","四","五","六","七","八","九","十","十一","十二",
            "十三","十四","十五","十六","十七","十八","十九","二十"];
  const CAT_ICO={lecture:"📖",practice:"✍️",homework:"📝",exam:"📊",other:"📦"};
  // 年级可以自带一级目录（如 Y11 的 听力/口语/作文/复习材料）；没写就用全站那五类。
  const catsOf=g=>(g&&g.categories)||C.categories;
  const catName=(id,g)=>{const c=catsOf(g).find(x=>x.id===id);return c?c.name:id;};
  document.getElementById('brand').textContent=C.site;
  document.getElementById('siteTitle').textContent=C.site;
  document.title=C.site;

  let state={g:0,cat:null,course:null,skill:null,unit:null}, kw="";

  // ---- hash 路由：让「回到某个年级/分类」能用链接表达 ----
  // 形如 #g=1&cat=review&skill=口语&course=kongzi。课页的面包屑就指这种地址。
  // 附带好处：下钻时 pushState，手机返回手势/浏览器后退能一级一级退。
  // 无 hash 时行为与改造前完全一致（默认第一个年级）。
  function readHash(){
    const h=(location.hash||"").replace(/^#/,""); if(!h) return false;
    const q={}; h.split("&").forEach(kv=>{const i=kv.indexOf("="); if(i>0) q[kv.slice(0,i)]=decodeURIComponent(kv.slice(i+1));});
    const gi=parseInt(q.g,10);
    state={ g:(gi>=0&&gi<C.grades.length)?gi:0, cat:q.cat||null, course:q.course||null, skill:q.skill||null, unit:q.unit||null };
    return true;
  }
  function writeHash(push){
    const p=["g="+state.g];
    if(state.cat)    p.push("cat="+encodeURIComponent(state.cat));
    if(state.skill)  p.push("skill="+encodeURIComponent(state.skill));
    if(state.course) p.push("course="+encodeURIComponent(state.course));
    if(state.unit)   p.push("unit="+encodeURIComponent(state.unit));
    const h="#"+p.join("&");
    if(h===location.hash) return;
    if(push) history.pushState(null,"",h); else history.replaceState(null,"",h);
  }
  // 退到「无 hash」那一步时要回默认态，否则面包屑会停在上一级不动
  window.addEventListener("popstate",()=>{
    if(!readHash()) state={g:0,cat:null,course:null,skill:null,unit:null};
    render();
  });
  const gradesEl=document.getElementById('grades'), crumbEl=document.getElementById('crumb'), listEl=document.getElementById('list');

  // ---- 全站搜索索引 ----
  const FLAT=[];
  C.grades.forEach(g=>{
    (g.lecture||[]).forEach(co=>(co.sections||[]).forEach(s=>FLAT.push({url:s.url,title:`第${CN[s.n-1]}节 ${s.title}`,ready:s.ready,tags:s.tags||[],path:`${g.name} · 授课 · ${co.no} ${co.title}`})));
    const pr=g.practice||{};
    Object.keys(pr).forEach(sk=>(pr[sk]||[]).forEach(it=>FLAT.push({url:it.url,title:it.title,ready:it.ready,tags:it.tags||[],path:`${g.name} · 练习 · ${sk}`})));
    // 除授课/练习外的类别（含年级自定义的），都是「项目数组」，一律按同一种方式进搜索索引
    catsOf(g).forEach(c=>{ if(c.id==="lecture"||c.id==="practice") return;
      (g[c.id]||[]).forEach(it=>{
        FLAT.push({url:it.url,title:it.title,ready:it.ready,tags:it.tags||[],path:`${g.name} · ${c.name}`});
        // 可下钻的单元：每节也单独进索引，否则搜「环境」只能命中整个单元、点进去落到第 3 节
        if(it.drill) (it.sections||[]).forEach(sec=>FLAT.push({
          url:sec.url, title:`第${CN[sec.n-1]}节 ${sec.title}`, ready:sec.ready,
          tags:sec.tags||[], path:`${g.name} · ${c.name} · ${it.title}`}));
      });});
  });
  FLAT.forEach(f=>f.hay=(f.title+" "+f.tags.join(" ")+" "+f.path).toLowerCase());
  function kwMatch(hay){const t=kw.match(/[a-z0-9]+|[一-鿿]/g)||[kw];return t.every(x=>hay.includes(x));}

  // ---- 年级标签 ----
  C.grades.forEach((g,i)=>{const b=document.createElement('button');b.className='chip-f'+(i===0?' on':'');b.textContent=g.name;b.onclick=()=>{state={g:i,cat:null,course:null,skill:null,unit:null};writeHash(true);render();};gradesEl.appendChild(b);});

  document.getElementById('search').addEventListener('input',e=>{kw=e.target.value.trim().toLowerCase();render();});

  // ---- 卡片 ----
  function catCard(g,c){
    let cnt=0;
    if(c.id==="lecture")cnt=(g.lecture||[]).length+" 门课";
    else if(c.id==="practice"){let n=0;Object.values(g.practice||{}).forEach(a=>n+=a.length);cnt=n+" 个练习";}
    else cnt=(g[c.id]||[]).length+" 项";
    return `<div class="lcard nav cat" data-cat="${c.id}"><span class="ico">${c.ico||CAT_ICO[c.id]||"📁"}</span><div><div class="tt">${c.name}</div><div class="cnt">${cnt}</div></div></div>`;
  }
  function courseCard(co){return `<div class="lcard nav" data-course="${co.id}"><div class="no">${co.no}</div><div class="tt">${co.title}</div><div class="cnt">${co.topic||""} · ${(co.sections||[]).length} 节</div></div>`;}
  function skillCard(g,sk){return `<div class="lcard nav" data-skill="${sk}"><div class="tt">${sk}</div><div class="cnt">${(g.practice[sk]||[]).length} 个</div></div>`;}
  function linkCard(it,label){
    // 卡片小字：有分节的（练习类）显示节名，比一堆关键词有用；没分节的才回退到 tags。
    // tags 不动，搜索索引照旧用它，所以搜「中西合璧」这类词仍然搜得到。
    const chips=(it.sections||[]).length ? it.sections.map(s=>s.title) : (it.tags||[]);
    const tags=chips.map(t=>`<span>${t}</span>`).join("");
    const path=label?`<div class="res-path">${label}</div>`:"";
    if(it.ready===false) return `<div class="lcard soon">${path}<div class="tt">${it.title}</div><div class="no"><span class="badge">敬请期待</span></div><div class="tags">${tags}</div></div>`;
    return `<a class="lcard" href="${it.url}">${path}<div class="tt">${it.title}</div><div class="tags">${tags}</div></a>`;
  }
  // 可下钻的单元卡：点它展开节列表，而不是直接跳某一节
  function unitCard(it){
    const n=(it.sections||[]).length;
    const done=(it.sections||[]).filter(s=>s.ready!==false).length;
    const cnt=done===n?`${n} 节`:`${n} 节 · 已上线 ${done}`;
    return `<div class="lcard nav" data-unit="${it.id}"><div class="tt">${it.title}</div><div class="cnt">${cnt}</div></div>`;
  }
  function sectionCard(s){
    const it={url:s.url,title:`第${CN[s.n-1]}节 · ${s.title}`,ready:s.ready,tags:s.tags};
    return linkCard(it);
  }
  const grid=h=>`<div class="cards">${h}</div>`;
  const empty=t=>`<div class="empty">${t||"暂无内容 · 敬请期待"}</div>`;

  // ---- 面包屑 ----
  function crumb(){
    const g=C.grades[state.g];
    let h=`<a data-nav="grade">${g.name}</a>`;
    if(state.cat){h+=`<span class="sep">›</span>`;
      if(state.course||state.skill||state.unit)h+=`<a data-nav="cat">${catName(state.cat,g)}</a>`;
      else h+=`<span class="cur">${catName(state.cat,g)}</span>`;
    }
    if(state.course){const co=g.lecture.find(x=>x.id===state.course);h+=`<span class="sep">›</span><span class="cur">${co.no} ${co.title}</span>`;}
    if(state.skill){h+=`<span class="sep">›</span><span class="cur">${state.skill}</span>`;}
    // 单元下钻（如「作文-话题-基础词句」的 15 节）多一级
    if(state.unit){const u=findUnit(g);if(u)h+=`<span class="sep">›</span><span class="cur">${u.title}</span>`;}
    crumbEl.innerHTML=h;
  }

  // ---- 渲染 ----
  function render(){
    [...gradesEl.children].forEach((c,i)=>c.classList.toggle('on',i===state.g));
    if(kw){ crumbEl.innerHTML=""; const r=FLAT.filter(f=>kwMatch(f.hay)); listEl.innerHTML=r.length?grid(r.map(it=>linkCard(it,it.path)).join("")):empty("没有找到相关内容 No results"); return; }
    crumb();
    const g=C.grades[state.g];
    if(!state.cat){ listEl.innerHTML=grid(catsOf(g).map(c=>catCard(g,c)).join("")); return; }
    if(state.cat==="lecture"){
      if(!state.course){ const co=g.lecture||[]; listEl.innerHTML=co.length?grid(co.map(courseCard).join("")):empty(); return; }
      const course=g.lecture.find(x=>x.id===state.course);
      const ov = course.overview
        ? `<a class="lcard" href="${course.overview}"><div class="no">📖 课文总览</div><div class="tt">全文朗读 + 分节</div><div class="cnt">先从这里开始</div></a>`
        : "";
      listEl.innerHTML=grid(ov + (course.sections||[]).map(sectionCard).join("")); return;
    }
    if(state.cat==="practice"){
      if(!state.skill){ listEl.innerHTML=grid(C.practiceSkills.map(sk=>skillCard(g,sk)).join("")); return; }
      const items=g.practice[state.skill]||[]; listEl.innerHTML=items.length?grid(items.map(it=>linkCard(it)).join("")):empty(); return;
    }
    const items=g[state.cat]||[];
    // 带 drill 的条目（每节独立成页、没有自己首页的单元）先展开节列表再进节
    if(state.unit){
      const u=findUnit(g);
      if(u){ listEl.innerHTML=grid((u.sections||[]).map(sectionCard).join("")); return; }
      state.unit=null;   // hash 里的 unit 找不到就退回本级，别白屏
    }
    listEl.innerHTML=items.length?grid(items.map(it=>it.drill&&(it.sections||[]).length?unitCard(it):linkCard(it)).join("")):empty();
  }
  // 在当前年级的所有「项目数组」类别里按 id 找带 drill 的单元
  function findUnit(g){
    let hit=null;
    catsOf(g).forEach(c=>{ if(c.id==="lecture"||c.id==="practice") return;
      (g[c.id]||[]).forEach(it=>{ if(it.id===state.unit) hit=it; }); });
    return hit;
  }

  // ---- 点击（下钻 + 面包屑）----
  document.addEventListener('click',e=>{
    const el=e.target.closest('[data-cat],[data-course],[data-skill],[data-unit],[data-nav]'); if(!el)return;
    if(el.dataset.nav==="grade"){state.cat=state.course=state.skill=state.unit=null;}
    else if(el.dataset.nav==="cat"){state.course=state.skill=state.unit=null;}
    else if(el.dataset.cat){state.cat=el.dataset.cat;state.course=null;state.skill=null;state.unit=null;}
    else if(el.dataset.course){state.course=el.dataset.course;}
    else if(el.dataset.skill){state.skill=el.dataset.skill;}
    else if(el.dataset.unit){state.unit=el.dataset.unit;}
    writeHash(true);
    render();
  });

  readHash();          // 带 hash 进来（从课页面包屑点回来）就还原到那一层
  render();
})();
</script>
<script>if('serviceWorker' in navigator){var _hadCtrl=!!navigator.serviceWorker.controller;navigator.serviceWorker.register('sw.js').catch(function(){});var _reloaded=false;navigator.serviceWorker.addEventListener('controllerchange',function(){if(_reloaded||!_hadCtrl)return;_reloaded=true;location.reload();});}</script>
</body>
</html>
