<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>老师成绩看板 · VCE 中文</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .login{max-width:360px;margin:30px auto}
  .login input{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;margin:8px 0}
  .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
  .controls select,.controls button{padding:8px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;background:#fff;cursor:pointer}
  .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:10px 0}
  .metric{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .metric .lab{font-size:12px;color:var(--muted)}
  .metric .val{font-size:24px;font-weight:700;color:var(--blue-d)}
  table.res{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px;background:#fff;border-radius:10px;overflow:hidden}
  table.res th,table.res td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line)}
  table.res th{background:#eef4ff;color:var(--blue-d);font-weight:600;position:sticky;top:52px}
  table.res tr:last-child td{border-bottom:none}
  .pct{font-weight:600}
  .pct.hi{color:var(--ok)} .pct.mid{color:#b8860b} .pct.lo{color:var(--no)}
  .tblwrap{overflow-x:auto}
  .msg{font-size:13px;margin-top:8px;min-height:18px}
  .msg.b{color:var(--no)} .msg.g{color:var(--ok)}
  /* —— 交作业统计：标签页 + 两个视图 —— */
  .tabs{display:flex;gap:6px;margin:4px 0 12px;flex-wrap:wrap}
  .tab{padding:8px 14px;border:1px solid var(--line);border-radius:20px;background:#fff;font-size:14px;font-family:inherit;cursor:pointer;color:var(--muted)}
  .tab.on{background:var(--blue-d);color:#fff;border-color:var(--blue-d)}
  .warn{font-size:13px;margin:2px 0 8px;padding:8px 12px;border-radius:8px;background:#fff8e6;border:1px solid #f0d68a;color:#8a6d1a;min-height:0}
  .warn:empty{display:none}
  .card.list{padding:0;overflow:hidden}
  .grp{font-weight:600;margin:0;padding:9px 12px;color:var(--blue-d);font-size:13px;background:#eef4ff;border-bottom:1px solid var(--line)}
  .chk{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:14px}
  .chk:last-child{border-bottom:none}
  .chk.miss{background:#fff5f5}
  .chk .st{font-weight:600;white-space:nowrap}
  .chk.miss .st{color:var(--no)}
  .chk.ok .st{color:var(--ok)}
  .seats{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .seat{min-width:40px;text-align:center;padding:7px 8px;border-radius:8px;font-size:13px;font-weight:600;border:1px solid var(--line)}
  .seat.ok{background:#e9f8ef;color:var(--ok);border-color:#bfe6cd}
  .seat.miss{background:#fdecec;color:var(--no);border-color:#f2c2c2}
  .misslist{margin-top:12px;font-size:15px;font-weight:600}
  .misslist .no{color:var(--no)}
  /* 三个年级标签（2026-11-23）*/
  .gtag{display:inline-block;padding:1px 7px;border-radius:9px;font-size:12px;font-weight:600;white-space:nowrap}
  .g-prep{background:#fff3e0;color:#a35d00}.g-y11{background:#e8f1ff;color:#1b5bc4}.g-y12{background:#f1e9ff;color:#6a3bb8}
  .gsec{font-weight:700;margin:14px 0 4px;font-size:15px}
  .keep-on{background:#e9f8ef!important;border-color:#7cc89a!important;color:var(--ok)!important}
  .purge-note{background:#fff8ec;border:1px solid #f0c27a;color:#8a5200;border-radius:10px;padding:9px 12px;margin:10px 0;font-size:14px}
  /* 12 月 15 日清公开课成绩的弹窗 */
  .modal{position:fixed;inset:0;background:rgba(20,30,50,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
  .modal[hidden]{display:none}
  .modal-box{background:#fff;border-radius:16px;max-width:440px;width:100%;padding:22px 20px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
  .modal-box h3{margin:0 0 8px;font-size:18px}
  .modal-box p{margin:0 0 14px;line-height:1.6;font-size:15px}
  .modal-box button{display:block;width:100%;margin-top:8px;padding:11px 0;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;border:1.5px solid var(--line);background:#fff}
  .modal-box .danger{background:#c0392b;border-color:#c0392b;color:#fff}
</style>
</head>
<body>
<div class="topbar"><div class="row"><div class="brand">VCE 中文 · 老师成绩看板</div><a href="index.html" style="background:rgba(255,255,255,.18);color:#fff;border-radius:20px;padding:5px 12px;font-size:13px;font-weight:500;white-space:nowrap;margin-left:auto">🏠 授课网站</a><div class="score" id="who" style="display:none"></div></div></div>
<div class="wrap">

  <div id="loginView" class="card login">
    <div style="font-weight:600;margin-bottom:6px">🔐 老师登录</div>
    <div style="font-size:13px;color:var(--muted);margin-bottom:6px">仅老师可见，学生看不到。</div>
    <input id="email" type="email" placeholder="邮箱 email" autocomplete="username">
    <input id="pwd" type="password" placeholder="密码 password" autocomplete="current-password">
    <button id="loginBtn" class="submit-btn" style="width:100%;margin-top:6px">登录 Log in</button>
    <div id="loginMsg" class="msg"></div>
  </div>

  <div id="dashView" style="display:none">
    <div class="tabs">
      <button class="tab on" data-view="detail">📋 成绩明细</button>
      <button class="tab" data-view="byStudent">🧑 交作业 · 按学生</button>
      <button class="tab" data-view="byExercise">📝 交作业 · 按练习</button>
      <button class="tab" data-view="accounts">🔓 账号审批</button>
      <button id="logoutBtn" style="margin-left:auto;padding:8px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;background:#fff;cursor:pointer">退出</button>
    </div>
    <div id="orphanWarn" class="warn"></div>
    <div id="yearNote" style="font-size:12px;color:var(--muted);margin:-2px 0 8px"></div>

    <!-- 视图①：成绩明细（原看板）-->
    <div id="viewDetail">
      <div class="controls">
        <select id="fGrade"><option value="">全部年级</option><option>VCE准备</option><option>Y11</option><option>Y12</option></select>
        <select id="fCat"><option value="">全部类别</option></select>
        <select id="fLesson"><option value="">全部项目</option></select>
        <select id="fClass"><option value="">全部班级</option></select>
        <select id="fSeat"><option value="">全部座号</option></select>
        <button id="refreshBtn">🔄 刷新</button>
        <button id="csvBtn">⬇ 导出CSV</button>
      </div>
      <div class="metrics" id="metrics"></div>
      <div id="analysis"></div>
      <div class="tblwrap"><table class="res" id="tbl"></table></div>
      <div id="dashMsg" class="msg"></div>
    </div>

    <!-- 视图②：按学生 —— 这名学生哪些没交 -->
    <div id="viewByStudent" style="display:none">
      <div class="controls">
        <select id="sGrade"><option value="">全部年级</option><option>VCE准备</option><option>Y11</option><option>Y12</option></select>
        <select id="sClass"></select>
        <select id="sSeat"></select>
        <button id="sRefresh">🔄 刷新</button>
      </div>
      <div class="metrics" id="sMetrics"></div>
      <div id="sList"></div>
    </div>

    <!-- 视图③：按练习 —— 这一节谁没交 -->
    <div id="viewByExercise" style="display:none">
      <div class="controls">
        <select id="eGrade"><option value="">全部年级</option><option>VCE准备</option><option>Y11</option><option>Y12</option></select>
        <select id="eLesson"></select>
        <select id="eClass"></select>
        <button id="eRefresh">🔄 刷新</button>
        <button id="eCsv">⬇ 导出CSV</button>
      </div>
      <div class="metrics" id="eMetrics"></div>
      <div id="eGrid"></div>
    </div>

    <!-- 视图④：账号审批（Y11/Y12 访问锁）-->
    <div id="viewAccounts" style="display:none">
      <div class="controls"><button id="aRefresh">🔄 刷新</button><span id="aMsg" class="msg"></span></div>
      <div id="aPending"></div>
      <div id="aApproved"></div>
      <div id="aDisabled"></div>
    </div>
  </div>

  <!-- 每年 12 月 15 日：问老师清不清公开课成绩（2026-11-23 用户定：确认才删，不删就问几天后再提醒）-->
  <div class="modal" id="scModal" hidden>
    <div class="modal-box">
      <h3>🗓 清理日到了（12 月 15 日）</h3>
      <p>要清除<b>截至今天的所有公开课成绩</b>吗？共 <b id="scN">0</b> 条。<br>
        <span style="color:#c0392b">删了就找不回来</span>，建议先下载备份。<br>
        <small style="color:var(--muted)">学生账号的成绩不在这里：账号到期清除时会跟着一起删。</small></p>
      <button id="scBackup">⬇ 先下载备份（Excel 能打开）</button>
      <button id="scClear" class="danger">🗑 确认清除</button>
      <button id="scLater">⏰ 先不删，过几天再问我</button>
      <div id="scMsg" class="msg"></div>
    </div>
  </div>

</div>

<script src="assets/catalog.js"></script>
<script src="assets/report-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function(){
  const SUPABASE_URL="https://xzexcfqrftllicoqaizs.supabase.co";
  const SUPABASE_KEY="sb_publishable_ly64tG2XPMv8N-34Np5qkQ_2d8rNRU5";
  const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  const CN=["一","二","三","四","五","六","七","八","九","十"];

  // lesson id → 好看的名字（读 catalog）
  const LMAP={};
  (window.CATALOG?CATALOG.grades:[]).forEach(g=>(g.lecture||[]).forEach(co=>(co.sections||[]).forEach(s=>{LMAP[s.id]=`${co.no}${co.title}·第${CN[s.n-1]}节`;})));
  // 学期条目（10 年级 T1…）：T1·WK1 句式
  (window.CATALOG?CATALOG.grades:[]).forEach(g=>(g.lecture||[]).forEach(co=>(co.weeks||[]).forEach(wk=>(wk.groups||[]).forEach(gr=>(gr.sections||[]).forEach(s=>{LMAP[s.id]=`${co.no}·${wk.no} ${s.title}`;})))));
  const lname=id=>LMAP[id]||id;

  // lesson id → 年级（VCE准备 / Y11 / Y12）：看 catalog 里哪个年级收了这一节（含受保护课的 ?id=）。
  // catalog 查不到的旧练习按 id 前缀猜：y11- → Y11、y12- → Y12，其余算 VCE准备（2026-11-23）
  const GNAME={prep:"VCE准备",y11:"Y11",y12:"Y12"}, GORDER=["VCE准备","Y11","Y12"];
  const GMAP={};
  (window.CATALOG?CATALOG.grades:[]).forEach(g=>{
    const name=GNAME[g.id]||g.name;
    (function walk(o){
      if(Array.isArray(o)){ o.forEach(walk); return; }
      if(!o||typeof o!=="object") return;
      if(typeof o.id==="string" && !(o.id in GMAP)) GMAP[o.id]=name;
      if(typeof o.url==="string"){ const m=o.url.match(/[?&]id=([^&#]+)/); if(m && !(m[1] in GMAP)) GMAP[m[1]]=name; }
      Object.keys(o).forEach(k=>{ if(o[k]&&typeof o[k]==="object") walk(o[k]); });
    })(g);
  });
  const gradeOf=id=>GMAP[id]||(/^y11-/.test(id)?"Y11":/^y12-/.test(id)?"Y12":"VCE准备");
  const gtag=g=>`<span class="gtag g-${g==="VCE准备"?"prep":g.toLowerCase()}">${g}</span>`;

  const $=id=>document.getElementById(id);
  let ROWS=[];

  async function init(){
    const {data:{session}}=await sb.auth.getSession();
    if(session) showDash(session); else showLogin();
  }
  function showLogin(){$('loginView').style.display='';$('dashView').style.display='none';$('who').style.display='none';}
  function showDash(session){
    $('loginView').style.display='none';$('dashView').style.display='';
    $('who').style.display='';$('who').textContent=session.user.email;
    load();
  }

  $('loginBtn').onclick=async()=>{
    const email=$('email').value.trim(), password=$('pwd').value;
    const m=$('loginMsg'); m.textContent="登录中…";m.className="msg";
    const {data,error}=await sb.auth.signInWithPassword({email,password});
    if(error){m.textContent="登录失败："+error.message;m.className="msg b";}
    else{m.textContent="";showDash(data.session);}
  };
  $('logoutBtn').onclick=async()=>{await sb.auth.signOut();showLogin();};
  $('refreshBtn').onclick=load;

  async function load(){
    const m=$('dashMsg');m.textContent="读取中…";m.className="msg";
    const {data,error}=await sb.from('kongzi_results').select('*').order('created_at',{ascending:false});
    if(error){m.textContent="读取失败："+error.message+"（是否已加 select 权限策略？）";m.className="msg b";return;}
    const cut=(window.REPORT_CONFIG||{}).schoolYearStart;
    ALLROWS=data||[];
    ROWS=(data||[]).filter(r=>!cut || new Date(r.created_at)>=new Date(cut));
    m.textContent="";
    $('yearNote').textContent = cut ? `📅 只显示 ${cut} 起的提交（共 ${ROWS.length} 条）· 明年重置改 report-config.js 的 schoolYearStart` : '';
    fillFilters();
    render();
    buildReport();
    checkScoreClear();
  }

  /* ===== 12 月 15 日清公开课成绩（弹窗问老师）===== */
  let ALLROWS=[], SC_CHECKED=false;
  async function checkScoreClear(){
    if(SC_CHECKED) return; SC_CHECKED=true;            // 每次打开看板只问一次
    const {data:st,error}=await sb.from('vce_settings').select('score_clear_at').eq('id',1).maybeSingle();
    if(error||!st||!st.score_clear_at||new Date(st.score_clear_at)>new Date()) return;
    const {data:n}=await sb.rpc('vce_public_score_count');
    $('scN').textContent=n||0; $('scMsg').textContent=''; $('scModal').hidden=false;
  }
  $('scBackup').onclick=()=>{
    const rows=ALLROWS.filter(r=>!r.user_id);
    const head=["时间UTC","年级","类别","班级","座号","课节id","课节","得分","满分"];
    const lines=rows.map(r=>[r.created_at,gradeOf(r.lesson),r.category||'授课',r.class_code||'',r.seat_no||'',r.lesson,lname(r.lesson),r.score,r.max_score].map(x=>`"${String(x).replace(/"/g,'""')}"`).join(","));
    const csv="﻿"+[head.join(","),...lines].join("\n");
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download="公开课成绩备份_"+new Date().toISOString().slice(0,10)+".csv";a.click();
    $('scMsg').textContent=`✓ 已下载 ${rows.length} 条`; $('scMsg').className='msg g';
  };
  $('scClear').onclick=async()=>{
    if(!confirm(`真的清除 ${$('scN').textContent} 条公开课成绩？删了就找不回来。`)) return;
    const {data:n,error}=await sb.rpc('vce_clear_public_scores');
    if(error){ $('scMsg').textContent='清除失败：'+error.message; $('scMsg').className='msg b'; return; }
    $('scModal').hidden=true; alert(`已清除 ${n} 条公开课成绩。明年 12 月 15 日会再问你。`); load();
  };
  $('scLater').onclick=async()=>{
    const v=prompt('几天后再问你？（1–365 天）','7'); if(v===null) return;
    const d=parseInt(v,10); if(!(d>=1&&d<=365)){ alert('请填 1 到 365 之间的天数'); return; }
    const {data:t,error}=await sb.rpc('vce_snooze_score_clear',{p_days:d});
    if(error){ $('scMsg').textContent='设置失败：'+error.message; $('scMsg').className='msg b'; return; }
    $('scModal').hidden=true; alert(`好，${fmtD(t)} 再问你。`);
  };
  function fill(sel,vals,labelFn,ph){
    const cur=sel.value;
    sel.innerHTML=`<option value="">${ph||'全部'}</option>`+vals.map(v=>`<option value="${v}">${labelFn?labelFn(v):v}</option>`).join("");
    if(vals.indexOf(cur)>=0) sel.value=cur;
  }
  function fillFilters(){
    fill($('fCat'), [...new Set(ROWS.map(r=>r.category||'授课'))].sort(), null, '全部类别');
    fillLessons();
    fill($('fClass'), [...new Set(ROWS.map(r=>r.class_code).filter(Boolean))].sort(), null, '全部班级');
    fillSeats();
  }
  function fillSeats(){
    const c=$('fClass').value;
    const seats=[...new Set(ROWS.filter(r=>!c||r.class_code===c).map(r=>r.seat_no).filter(x=>x!=null&&x!==''))]
      .sort((a,b)=>(parseInt(a,10)||0)-(parseInt(b,10)||0)).map(String);
    fill($('fSeat'), seats, null, '全部座号');
  }
  function fillLessons(){
    const cat=$('fCat').value, gr=$('fGrade').value;
    const ls=[...new Set(ROWS.filter(r=>(!cat||(r.category||'授课')===cat)&&(!gr||gradeOf(r.lesson)===gr)).map(r=>r.lesson))].sort();
    fill($('fLesson'), ls, lname, '全部项目');
  }
  $('fCat').onchange=()=>{fillLessons();render();};
  $('fGrade').onchange=()=>{fillLessons();render();};
  $('fLesson').onchange=render; $('fClass').onchange=()=>{fillSeats();render();}; $('fSeat').onchange=render;

  function filtered(){
    const gr=$('fGrade').value, cat=$('fCat').value, l=$('fLesson').value, c=$('fClass').value, s=$('fSeat').value.trim();
    return ROWS.filter(r=>(!gr||gradeOf(r.lesson)===gr)&&(!cat||(r.category||'授课')===cat)&&(!l||r.lesson===l)&&(!c||r.class_code===c)&&(!s||String(r.seat_no)===s));
  }
  function render(){
    const rows=filtered();
    // 指标
    const n=rows.length;
    const classes=new Set(rows.map(r=>r.class_code).filter(Boolean)).size;
    const pcts=rows.map(r=>r.max_score?r.score/r.max_score:0);
    const avg=n?Math.round(pcts.reduce((a,b)=>a+b,0)/n*100):0;
    $('metrics').innerHTML=
      metric("总提交数",n)+metric("参与班级",classes)+metric("平均正确率",avg+"%");
    // 表格
    let h=`<tr><th>时间(墨尔本)</th><th>年级</th><th>类别</th><th>班级</th><th>座号</th><th>课节/项目</th><th>得分</th></tr>`;
    h+=rows.map(r=>{
      const t=new Date(r.created_at).toLocaleString('en-AU',{timeZone:'Australia/Melbourne',year:'2-digit',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
      const p=r.max_score?Math.round(r.score/r.max_score*100):0;
      const cls=p>=80?'hi':p>=50?'mid':'lo';
      return `<tr><td>${t}</td><td>${gtag(gradeOf(r.lesson))}</td><td>${r.category||'授课'}</td><td>${r.class_code||''}</td><td>${r.seat_no||''}</td><td>${lname(r.lesson)}</td><td><span class="pct ${cls}">${r.score}/${r.max_score} · ${p}%</span></td></tr>`;
    }).join("");
    $('tbl').innerHTML=h;
    renderAnalysis(rows);
  }
  const metric=(lab,val)=>`<div class="metric"><div class="lab">${lab}</div><div class="val">${val}</div></div>`;

  function renderAnalysis(rows){
    const box=$('analysis');
    if(!$('fLesson').value){box.innerHTML="<div class='msg' style='color:var(--muted);margin:8px 0'>💡 选上面的「课节」下拉，可看这一节每道题的正确率</div>";return;}
    const agg={};
    rows.forEach(r=>(r.details||[]).forEach(d=>{const k=d.q;(agg[k]=agg[k]||{ok:0,n:0}).n++;if(d.ok)agg[k].ok++;}));
    const items=Object.keys(agg).map(k=>({q:k,ok:agg[k].ok,n:agg[k].n,pct:Math.round(agg[k].ok/agg[k].n*100)})).sort((a,b)=>a.pct-b.pct);
    if(!items.length){box.innerHTML="<div class='msg' style='color:var(--muted);margin:8px 0'>这一节暂无题目明细（学生用升级后的页面做题才会有）</div>";return;}
    box.innerHTML=`<div style="font-weight:600;margin:16px 0 4px">📊 每题正确率（低→高，红=最难，重点讲）</div>`+
      `<div class="tblwrap"><table class="res"><tr><th>题目</th><th>正确率</th><th>答对/人数</th></tr>`+
      items.map(it=>{const cls=it.pct>=80?'hi':it.pct>=50?'mid':'lo';return `<tr><td>${it.q}</td><td><span class="pct ${cls}">${it.pct}%</span></td><td>${it.ok}/${it.n}</td></tr>`;}).join("")+`</table></div>`;
  }

  /* ===== 交作业统计：按学生 / 按练习 ===== */
  const RC = window.REPORT_CONFIG || {roster:{}, assignments:[]};
  const NORM = s => String(s==null?'':s).trim().toUpperCase();
  const seatNum = s => { const n=parseInt(String(s==null?'':s).trim(),10); return isNaN(n)?null:n; };
  const rosterKey = c => Object.keys(RC.roster).find(k=>NORM(k)===NORM(c));   // 大小写容错
  const assignName = id => { const a=RC.assignments.find(x=>x.id===id); return a?a.name:lname(id); };
  let SUBMITTED = new Map();   // `${班级大写}|${座号}|${课节}` → 最新一条

  function buildReport(){
    SUBMITTED = new Map();
    ROWS.forEach(r=>{
      const c=NORM(r.class_code), s=seatNum(r.seat_no); if(s==null) return;
      const key=c+'|'+s+'|'+r.lesson, prev=SUBMITTED.get(key);
      if(!prev || new Date(r.created_at)>new Date(prev.created_at)) SUBMITTED.set(key,r);
    });
    fillReportControls(); renderOrphan(); renderStudent(); renderExercise();
  }
  function fillReportControls(){
    const classes=Object.keys(RC.roster);
    fill($('sClass'), classes, null, '选班级');
    fill($('eClass'), classes, null, '选班级');
    fillELesson();
    fillSeat();
  }
  // 按练习：先选年级，练习下拉只列这个年级的
  function fillELesson(){
    const gr=$('eGrade').value;
    fill($('eLesson'), RC.assignments.filter(a=>!gr||gradeOf(a.id)===gr).map(a=>a.id), a=>`${assignName(a)}（${gradeOf(a)}）`, '选练习/课节');
  }
  $('eGrade').onchange=()=>{ fillELesson(); renderExercise(); };
  $('sGrade').onchange=()=>renderStudent();
  function fillSeat(){
    const cls=$('sClass').value, seats=cls?(RC.roster[cls]||[]):[];
    fill($('sSeat'), seats.map(String), null, '选座号');
  }

  // 花名册外提交（访客/老师测试，或学生填错班号）——温和提示
  function renderOrphan(){
    const box=$('orphanWarn'); if(!box) return;
    const seen=new Set(), bad=[];
    ROWS.forEach(r=>{
      const c=NORM(r.class_code), s=seatNum(r.seat_no), key=c+'|'+s;
      if(seen.has(key)) return; seen.add(key);
      const rk=rosterKey(c);
      if(!(rk && (RC.roster[rk]||[]).includes(s))) bad.push((r.class_code||'?')+'-'+(r.seat_no||'?'));
    });
    box.innerHTML = bad.length
      ? `⚠️ ${bad.length} 个提交身份在花名册外（访客/老师测试，或学生填错班号）：${bad.slice(0,20).map(x=>`<b>${x}</b>`).join('、')}${bad.length>20?' …':''}`
      : '';
  }

  // 视图②：按学生 —— 这名学生哪些没交
  $('sClass').onchange=()=>{ fillSeat(); renderStudent(); };
  $('sSeat').onchange=renderStudent;
  $('sRefresh').onclick=load;
  function renderStudent(){
    const cls=$('sClass').value, seat=seatNum($('sSeat').value), box=$('sList');
    if(!cls || seat==null){ $('sMetrics').innerHTML=''; box.innerHTML="<div class='msg' style='color:var(--muted)'>选班级 + 座号，看这名学生每一节交了没</div>"; return; }
    const C=NORM(cls);
    const sg=$('sGrade').value;
    const items=RC.assignments.filter(a=>!sg||gradeOf(a.id)===sg).map(a=>({a, row:SUBMITTED.get(C+'|'+seat+'|'+a.id)}));
    const done=items.filter(x=>x.row).length, total=items.length;
    $('sMetrics').innerHTML=metric("该交",total)+metric("已交",done)+metric("未交",total-done);
    let h='', grp='';
    items.forEach(({a,row})=>{
      if(a.group!==grp){ grp=a.group; h+=`<div class="grp">${gtag(gradeOf(a.id))} ${grp}</div>`; }
      if(row){ const t=new Date(row.created_at).toLocaleDateString('en-AU',{timeZone:'Australia/Melbourne',month:'2-digit',day:'2-digit'});
        h+=`<div class="chk ok"><span>${a.name}</span><span class="st">✅ ${row.score}/${row.max_score} · ${t}</span></div>`;
      } else { h+=`<div class="chk miss"><span>${a.name}</span><span class="st">❌ 未交</span></div>`; }
    });
    box.innerHTML=`<div class="card list">${h}</div>`;
  }

  // 视图③：按练习 —— 这一节谁没交
  $('eLesson').onchange=renderExercise;
  $('eClass').onchange=renderExercise;
  $('eRefresh').onclick=load;
  function renderExercise(){
    const lesson=$('eLesson').value, cls=$('eClass').value, box=$('eGrid');
    if(!lesson || !cls){ $('eMetrics').innerHTML=''; box.innerHTML="<div class='msg' style='color:var(--muted)'>选练习 + 班级，看这一节谁没交</div>"; return; }
    const C=NORM(cls), seats=RC.roster[cls]||[], miss=[];
    seats.forEach(s=>{ if(!SUBMITTED.get(C+'|'+s+'|'+lesson)) miss.push(s); });
    $('eMetrics').innerHTML=metric("应交",seats.length)+metric("已交",seats.length-miss.length)+metric("未交",miss.length);
    const chips=seats.map(s=>{ const ok=!!SUBMITTED.get(C+'|'+s+'|'+lesson); return `<span class="seat ${ok?'ok':'miss'}">${ok?'✓':'✗'}${s}</span>`; }).join("");
    const missTxt=miss.length?`<div class="misslist">缺 <span class="no">${miss.length}</span> 人：座号 <span class="no">${miss.join('、')}</span></div>`:`<div class="misslist" style="color:var(--ok)">🎉 全班都交了！</div>`;
    box.innerHTML=`<div class="card"><div style="font-weight:600;margin-bottom:6px">${assignName(lesson)} · ${esc0(cls)} 班</div><div class="seats">${chips}</div>${missTxt}</div>`;
  }
  const esc0 = s => String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  $('eCsv').onclick=()=>{
    const lesson=$('eLesson').value, cls=$('eClass').value; if(!lesson||!cls) return;
    const C=NORM(cls), seats=RC.roster[cls]||[];
    const head=["班级","座号","状态","课节"];
    const lines=seats.map(s=>{ const ok=!!SUBMITTED.get(C+'|'+s+'|'+lesson); return [cls,s,ok?'已交':'未交',assignName(lesson)].map(x=>`"${String(x).replace(/"/g,'""')}"`).join(","); });
    const csv="﻿"+[head.join(","),...lines].join("\n");
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`交作业_${cls}_${lesson}.csv`;a.click();
  };

  // 标签页切换
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on')); t.classList.add('on');
    const v=t.dataset.view;
    $('viewDetail').style.display     = v==='detail'     ? '' : 'none';
    $('viewByStudent').style.display  = v==='byStudent'  ? '' : 'none';
    $('viewByExercise').style.display = v==='byExercise' ? '' : 'none';
    $('viewAccounts').style.display   = v==='accounts'   ? '' : 'none';
    if(v==='byStudent') renderStudent();
    if(v==='byExercise') renderExercise();
    if(v==='accounts') loadAccounts();
  });

  $('csvBtn').onclick=()=>{
    const rows=filtered();
    const head=["时间UTC","年级","类别","班级","座号","课节id","课节","得分","满分","正确率%"];
    const lines=rows.map(r=>[r.created_at,gradeOf(r.lesson),r.category||'授课',r.class_code||'',r.seat_no||'',r.lesson,lname(r.lesson),r.score,r.max_score,r.max_score?Math.round(r.score/r.max_score*100):''].map(x=>`"${String(x).replace(/"/g,'""')}"`).join(","));
    const csv="﻿"+[head.join(","),...lines].join("\n");
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download="成绩_"+new Date().toISOString().slice(0,10)+".csv";a.click();
  };

  /* ===== 账号审批（Y11/Y12 访问锁）===== */
  const fmtD = d => d ? new Date(d).toLocaleDateString('en-AU',{timeZone:'Australia/Melbourne',year:'2-digit',month:'2-digit',day:'2-digit'}) : '';
  let ACCT=new Map();   // id → profile（改名时取当前名）
  let NEXT_CUT=null;    // 下一个 12 月 15 日（数据库 vce_next_cutoff 算）
  async function loadAccounts(){
    const msg=$('aMsg'); msg.textContent='读取中…'; msg.className='msg';
    const [{data:profs,error:e1},{data:sess}] = await Promise.all([
      sb.from('vce_profiles').select('*').order('created_at',{ascending:true}),
      sb.from('vce_active_sessions').select('user_id,device_label,last_seen')
    ]);
    if(e1){ msg.textContent='读取失败：'+e1.message; msg.className='msg b'; return; }
    msg.textContent='';
    if(!NEXT_CUT){ const {data:c}=await sb.rpc('vce_next_cutoff'); NEXT_CUT=c||null; }
    const {data:{session}}=await sb.auth.getSession(); MY_EMAIL=(session&&session.user&&session.user.email)||"";
    const online=new Map((sess||[]).map(s=>[s.user_id,s]));
    ACCT=new Map((profs||[]).map(p=>[p.id,p]));
    renderAccounts(profs||[], online);
  }
  // 姓名大字 + 邮箱小字 + ✏️改名；老账号没填姓名显示「（未填）」
  const who = p => `<b style="font-size:16px">${p.display_name?esc0(p.display_name):'<span style="color:var(--muted);font-weight:400">（未填）</span>'}</b>`+
    ` <button class="tab" data-act="rename" data-id="${p.id}" title="改名" style="padding:1px 6px">✏️</button>`+
    ` <small style="color:var(--muted)">${esc0(p.email||p.id)}</small>`;
  const byName = (a,b) => (a.display_name||'￿').localeCompare(b.display_name||'￿','zh');
  // 三个年级（2026-11-23）：批准按钮三个，学生注册时申请的年级排第一、加粗；
  // 已批准按年级分三块；🛡 长期保留（同事等）每年 12 月 15 日不清除；「续期 1 年」取消（到期统一 12 月 15 日）
  const TIERS=["prep","y11","y12"];
  const approveBtns=(p,verb)=>{
    const req=p.requested_tier, order=req&&TIERS.includes(req)?[req,...TIERS.filter(t=>t!==req)]:TIERS;
    return order.map(t=>`<button class="tab${t===req?' on':''}" data-act="approve" data-tier="${t}" data-id="${p.id}" style="padding:5px 10px">${verb} ${GNAME[t]}</button>`).join(" ");
  };
  // 用户 11-23 要求：审核注册一定要明确年级 → 申请年级用大号标签；没选年级的标红
  const reqTag=p=>p.requested_tier
    ?` <span style="font-size:14px">申请 <span class="gtag g-${p.requested_tier}" style="font-size:15px;padding:3px 10px">${GNAME[p.requested_tier]}</span></span>`
    :` <span class="gtag" style="font-size:14px;padding:3px 10px;background:#fdecec;color:var(--no)">⚠ 没选年级，批准前请先问学生</span>`;
  let MY_EMAIL="";
  function renderAccounts(profs, online){
    profs = profs.slice().sort(byName);
    const pending =profs.filter(p=>p.status==='pending');
    const approved=profs.filter(p=>p.status==='approved');
    const disabled=profs.filter(p=>p.status==='disabled');
    const isMe=p=>MY_EMAIL&&p.email===MY_EMAIL;
    // 下次清除（规则同数据库 vce_purge_expired）：不保留、不是老师自己，且 已批准到期 / 没批准的旧注册
    const cut=NEXT_CUT?new Date(NEXT_CUT):null;
    const willGo=cut?profs.filter(p=>!p.keep&&!isMe(p)&&((p.status==='approved'&&p.access_until&&new Date(p.access_until)<=cut)||(p.status!=='approved'&&new Date(p.created_at)<cut))).length:0;
    const note=cut?`<div class="purge-note">🗓 下次清除：<b>${fmtD(cut)}</b>（12 月 15 日）· 到时会清除 <b>${willGo}</b> 个账号和它们的成绩；标了 🛡 长期保留的不清除</div>`:'';
    $('aPending').innerHTML = note + `<div style="font-weight:600;margin:14px 0 4px">🕓 待审批（${pending.length}）</div>` + (pending.length?
      `<div class="card list">`+pending.map(p=>
        `<div class="chk"><span>${who(p)}${reqTag(p)}</span><span class="st">${approveBtns(p,'批准')}</span></div>`).join("")+`</div>`
      : `<div class="msg" style="color:var(--muted)">暂无待审批</div>`);
    const row=p=>{
      const exp=p.access_until, expired=!p.keep&&exp&&new Date(exp)<new Date(), on=online.get(p.id), me=isMe(p);
      return `<div class="chk ${expired?'miss':'ok'}"><span>${who(p)} `+
        `<small style="color:var(--muted)">${p.keep||me?'🛡 长期保留':'到期 '+fmtD(exp)+(expired?'（已过期）':'')}${on?' · 🟢在线':''}</small></span>`+
        `<span class="st">`+
        (on?`<button class="tab" data-act="kick" data-id="${p.id}" style="padding:5px 10px">踢下线</button> `:'')+
        (me?'':`<button class="tab${p.keep?' keep-on':''}" data-act="keep" data-keep="${p.keep?1:0}" data-id="${p.id}" style="padding:5px 10px" title="标了就每年 12 月 15 日都不清除">🛡 ${p.keep?'已长期保留':'长期保留'}</button> `)+
        `<select class="tab" data-act="retier" data-id="${p.id}" style="padding:5px 6px">${TIERS.map(t=>`<option value="${t}"${t===p.tier?' selected':''}>${GNAME[t]}</option>`).join("")}</select> `+
        (me?'':`<button class="tab" data-act="disable" data-id="${p.id}" style="padding:5px 10px">停用</button>`)+`</span></div>`;
    };
    $('aApproved').innerHTML = `<div style="font-weight:600;margin:16px 0 4px">✅ 已批准（${approved.length}）</div>` + (approved.length?
      TIERS.map(t=>{ const list=approved.filter(p=>p.tier===t);
        return `<div class="gsec">${gtag(GNAME[t])} ${list.length} 人</div>`+(list.length?`<div class="card list">${list.map(row).join("")}</div>`:`<div class="msg" style="color:var(--muted)">暂无</div>`);
      }).join("")
      : `<div class="msg" style="color:var(--muted)">暂无</div>`);
    $('aDisabled').innerHTML = disabled.length? `<div style="font-weight:600;margin:16px 0 4px">🚫 已停用（${disabled.length}）</div>`+
      `<div class="card list">`+disabled.map(p=>
        `<div class="chk"><span>${who(p)} ${p.tier?gtag(GNAME[p.tier]):''}</span>`+
        `<span class="st">${approveBtns(p,'恢复→')}</span></div>`).join("")+`</div>` : '';
  }
  // 改年级（下拉）
  $('viewAccounts').addEventListener('change', async e=>{
    const s=e.target.closest('select[data-act="retier"]'); if(!s) return;
    s.disabled=true;
    try{ const {error}=await sb.from('vce_profiles').update({tier:s.value}).eq('id',s.dataset.id); if(error)throw error; await loadAccounts(); }
    catch(err){ $('aMsg').textContent='操作失败：'+(err.message||err); $('aMsg').className='msg b'; s.disabled=false; }
  });
  $('viewAccounts').addEventListener('click', async e=>{
    const b=e.target.closest('button[data-act]'); if(!b) return;
    const id=b.dataset.id, act=b.dataset.act; b.disabled=true;
    try{
      if(act==='approve'){
        // 每次批准都确认年级；和学生申请的不一样要特别提醒
        const p=ACCT.get(id)||{}, t=b.dataset.tier, req=p.requested_tier;
        let q=`批准「${p.display_name||p.email||''}」为【${GNAME[t]}】？`;
        if(!req) q+=`\n\n⚠ 这个学生注册时没选年级。`;
        else if(req!==t) q+=`\n\n⚠ 注意：他申请的是【${GNAME[req]}】，你要批的是【${GNAME[t]}】。`;
        if(!confirm(q)){ b.disabled=false; return; }
        const {error}=await sb.rpc('vce_approve',{p_user:id,p_tier:b.dataset.tier,p_months:12}); if(error)throw error; }
      else if(act==='keep'){ const on=b.dataset.keep!=='1';
        if(!on && !confirm('取消长期保留？取消后，这个账号会在 12 月 15 日被清除。')) { b.disabled=false; return; }
        const {error}=await sb.from('vce_profiles').update({keep:on}).eq('id',id); if(error)throw error; }
      else if(act==='disable'){ if(!confirm('确定停用这个账号？停用后该学生无法查看内容。')) { b.disabled=false; return; } const {error}=await sb.from('vce_profiles').update({status:'disabled'}).eq('id',id); if(error)throw error; }
      else if(act==='rename'){ const cur=(ACCT.get(id)||{}).display_name||''; const nv=prompt('学生姓名：',cur); if(nv===null){ b.disabled=false; return; } const {error}=await sb.from('vce_profiles').update({display_name:nv.trim().slice(0,40)||null}).eq('id',id); if(error)throw error; }
      else if(act==='kick'){ const {error}=await sb.from('vce_active_sessions').delete().eq('user_id',id); if(error)throw error; }
      await loadAccounts();
    }catch(err){ $('aMsg').textContent='操作失败：'+(err.message||err); $('aMsg').className='msg b'; b.disabled=false; }
  });
  $('aRefresh').onclick=loadAccounts;

  init();
})();
</script>
<script>if('serviceWorker' in navigator){var _hadCtrl=!!navigator.serviceWorker.controller;navigator.serviceWorker.register('sw.js').catch(function(){});var _reloaded=false;navigator.serviceWorker.addEventListener('controllerchange',function(){if(_reloaded||!_hadCtrl)return;_reloaded=true;location.reload();});}</script>
</body>
</html>
